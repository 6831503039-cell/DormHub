steps:
 # Build the container image
 - name: 'gcr.io/cloud-builders/docker'
   args: [ 'build', '-t', 'us-central1-docker.pkg.dev/${_PROJECT_ID}/dormhub-dockers/dormhub:$COMMIT_SHA', '.' ]
 # Push the container image to Artifact Registry
 - name: 'gcr.io/cloud-builders/docker'
   args: ['push', 'us-central1-docker.pkg.dev/${_PROJECT_ID}/dormhub-dockers/dormhub:$COMMIT_SHA']
 # Deploy container image to Cloud Run
 - name: 'gcr.io/cloud-builders/gcloud'
   entrypoint: gcloud
   args:
   - 'run'
   - 'deploy'
   - 'dormhub'
   - '--image'
   - 'us-central1-docker.pkg.dev/${_PROJECT_ID}/dormhub-dockers/dormhub:$COMMIT_SHA'
   - '--region'
   - 'us-central1'
   - '--allow-unauthenticated'
   - '--platform'
   - 'managed'
   - '--port'
   - '8100'
   # the database (H2) and login sessions live in memory, so every request must reach the same instance:
   # a second instance would not know accounts registered or sessions started on the first one
   - '--max-instances'
   - '1'
   - '--session-affinity'
images:
 - 'us-central1-docker.pkg.dev/${_PROJECT_ID}/dormhub-dockers/dormhub'

substitutions:
  _PROJECT_ID: 'dormhub-512309'

options:
  logging: CLOUD_LOGGING_ONLY
