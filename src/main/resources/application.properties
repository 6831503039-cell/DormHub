spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

server.port=8100

# UI texts: messages.properties (Thai, the default) and messages_en.properties (English)
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

spring.datasource.url=jdbc:h2:mem:dormhub
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create
# @GeneratedValue(strategy = GenerationType.AUTO) as in class; "false" keeps one id counter per table
# (rooms 1,2,3..., bills 1,2,3...) instead of one shared hibernate_sequence for every table
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# demo data is created by th.mfu.service.DataSeeder
spring.sql.init.mode=never

# slip uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Dorm settings (Thai texts have defaults in DormProperties.java).
# Every value can be overridden with an environment variable, e.g. DORMHUB_ADMIN_PASSWORD.
dormhub.admin.email=sjdadmin@gmail.com
dormhub.admin.password=dormhub123
dormhub.wifi.ssid=DormHub_5G
dormhub.wifi.password=dormhub2026
dormhub.promptpay-id=0628307781
# the QR shown to tenants is the image static/img/promptpay-qr.png (account name: DormProperties.promptpayName)
dormhub.due-day=5

# Gemini API: set the GEMINI_API_KEY environment variable to enable the AI chatbot and AI slip check
dormhub.gemini.api-key=${GEMINI_API_KEY:}
dormhub.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
