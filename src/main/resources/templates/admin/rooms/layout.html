<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout(#{nav.layout}, 'layout', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="#{layout.title}">แผนผังห้องพัก</h1>
            <p class="page-sub" th:text="#{layout.sub}">กดที่ตึกเพื่อดูแต่ละชั้น กดที่ห้องเพื่อดูผู้เช่าและห้องแบบ 3D</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-secondary" th:href="@{/explore}" target="_blank" rel="noopener"><i data-lucide="external-link"></i> <span th:text="#{layout.bookingPage}">หน้าจองห้อง</span></a>
            <a class="btn btn-primary" th:href="@{/admin/rooms/new}"><i data-lucide="plus"></i> <span th:text="#{rooms.add}">เพิ่มห้อง</span></a>
        </div>
    </div>

    <div id="dormMap" class="layout-3d mb-3" th:aria-label="#{map.aria}"></div>

    <div class="legend mb-4" th:aria-label="#{layout.legend}">
        <span><span class="dot success"></span><span th:text="#{roomStatus.AVAILABLE}">ว่าง</span></span>
        <span><span class="dot soon"></span><span th:text="#{mapStatus.SOON} + ' (3D)'">ใกล้หมดสัญญา (3D)</span></span>
        <span><span class="dot info"></span><span th:text="#{roomStatus.OCCUPIED}">มีผู้เช่า</span></span>
        <span><span class="dot warning"></span><span th:text="#{roomStatus.MAINTENANCE}">ปิดซ่อม</span></span>
    </div>

    <!-- the same rooms as a list: building > floor > rooms, each level folded until clicked -->
    <details class="card fold mb-3" th:each="building : ${buildings}">
        <summary class="fold-head">
            <span class="fold-title" th:text="#{common.buildingN(${building.key})}"></span>
            <span class="fold-meta"
                  th:text="#{layout.floorsN(${#maps.size(building.value)})} + ' · ' + #{common.freeOf(${buildingFree[building.key]}, ${buildingTotal[building.key]})}"></span>
            <i data-lucide="chevron-down" class="fold-chev"></i>
        </summary>
        <details class="fold fold-floor" th:each="floor : ${building.value}">
            <summary class="fold-head">
                <span class="fold-title" th:text="#{common.floorN(${floor.key})}"></span>
                <span class="fold-meta"
                      th:text="#{common.freeOf(${#lists.size(floor.value.?[status.name() == 'AVAILABLE'])}, ${#lists.size(floor.value)})}"></span>
                <i data-lucide="chevron-down" class="fold-chev"></i>
            </summary>
            <div class="fold-body">
                <div class="floor-row">
                    <a th:each="r : ${floor.value}" class="room-tile" th:classappend="${r.status.name()}" th:href="@{/admin/rooms/{id}(id=${r.id})}"
                       th:with="occ=${occupants.getOrDefault(r.id, 0L)}"
                       th:attr="aria-label=#{layout.tileAria(${r.roomNumber}, #{${r.status.key}}, ${occ}, ${r.capacity})}">
                        <div class="d-flex justify-content-between align-items-start gap-2">
                            <span class="num" th:text="${r.roomNumber}"></span>
                            <span th:class="'badge soft-' + ${r.status.badge}" th:text="#{${r.status.key}}"></span>
                        </div>
                        <div class="item-meta" th:text="${r.roomType}"></div>
                        <div class="d-flex justify-content-between item-meta mt-1">
                            <span><i data-lucide="users"></i> <span class="num" th:text="${occ} + '/' + ${r.capacity}"></span></span>
                            <span class="num" th:text="'฿' + ${#numbers.formatDecimal(r.monthlyRent, 1, 'COMMA', 0, 'POINT')}"></span>
                        </div>
                    </a>
                </div>
            </div>
        </details>
    </details>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script th:src="@{/js/dorm3d.js}"></script>
    <script th:inline="javascript">
        Dorm3D.mount({
            root: document.getElementById('dormMap'),
            dataUrl: /*[[@{/admin/layout/rooms}]]*/ '/admin/layout/rooms',
            mode: 'admin',
            soonDays: /*[[${soonDays}]]*/ 60,
            electricRate: /*[[${electricRate}]]*/ 7,
            waterRate: /*[[${waterRate}]]*/ 20,
            editUrl: /*[[@{/admin/rooms/}]]*/ '/admin/rooms/',
            bookingsUrl: /*[[@{/admin/bookings}]]*/ '/admin/bookings'
        });
    </script>
</main>
</body>
</html>
