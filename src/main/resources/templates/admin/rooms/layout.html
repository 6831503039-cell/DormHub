<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout('แผนผังห้อง', 'layout', ~{::main})}">
<body>
<main>
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <div>
            <h1 class="page-title">แผนผังห้องพัก</h1>
            <div class="text-muted small">กดที่ตึกเพื่อเข้าไปดูแต่ละชั้น กดที่ห้องเพื่อดูผู้เช่าและห้องแบบ 3D</div>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-light" th:href="@{/explore}" target="_blank" rel="noopener"><i data-lucide="external-link"></i> หน้าจองห้องสำหรับคนทั่วไป</a>
            <a class="btn btn-primary" th:href="@{/admin/rooms/new}"><i data-lucide="plus"></i> เพิ่มห้อง</a>
        </div>
    </div>

    <div id="dormMap" class="layout-3d mb-4" aria-label="แผนผังหอพัก 3 มิติ"></div>

    <div class="text-muted small mb-2">
        <span class="me-3"><span class="legend-dot" style="background:#22a565"></span>ว่าง</span>
        <span class="me-3"><span class="legend-dot" style="background:#2f80ed"></span>มีผู้เช่า</span>
        <span><span class="legend-dot" style="background:#f5b301"></span>ปิดซ่อม</span>
    </div>
    <th:block th:each="building : ${buildings}">
        <h2 class="h5 mt-4 mb-3" th:text="'ตึก ' + ${building.key}"></h2>
        <div class="card mb-3" th:each="floor : ${building.value}">
            <div class="card-header" th:text="'ตึก ' + ${building.key} + ' ชั้น ' + ${floor.key}"></div>
            <div class="card-body">
                <div class="floor-row">
                    <a th:each="r : ${floor.value}" class="room-tile" th:classappend="${r.status.name()}" th:href="@{/admin/rooms/{id}(id=${r.id})}">
                        <div class="d-flex justify-content-between align-items-start">
                            <span class="num" th:text="${r.roomNumber}"></span>
                            <span th:class="'badge soft-' + ${r.status.badge}" th:text="${r.status.label}"></span>
                        </div>
                        <div class="small text-muted" th:text="${r.roomType}"></div>
                        <div class="small mt-1">
                            <i data-lucide="users"></i>
                            <span th:text="${occupants.getOrDefault(r.id, 0L)} + '/' + ${r.capacity}"></span>
                            <span class="float-end" th:text="'฿' + ${#numbers.formatDecimal(r.monthlyRent, 1, 'COMMA', 0, 'POINT')}"></span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </th:block>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script th:src="@{/js/dorm3d.js}"></script>
    <script th:inline="javascript">
        Dorm3D.mount({
            root: document.getElementById('dormMap'),
            dataUrl: /*[[@{/admin/layout/rooms}]]*/ '/admin/layout/rooms',
            mode: 'admin',
            soonDays: /*[[${soonDays}]]*/ 60,
            editUrl: /*[[@{/admin/rooms/}]]*/ '/admin/rooms/',
            bookingsUrl: /*[[@{/admin/bookings}]]*/ '/admin/bookings'
        });
    </script>
</main>
</body>
</html>
