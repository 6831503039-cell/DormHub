<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout('ข้อมูลห้อง', 'rooms', ~{::main})}">
<body>
<main style="max-width: 760px">
    <h1 class="page-title mb-3" th:text="${room.id == null} ? 'เพิ่มห้อง' : 'ห้อง ' + ${room.roomNumber}">เพิ่มห้อง</h1>

    <form class="card card-body mb-3" th:action="@{/admin/rooms}" th:object="${room}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label" for="roomNumber">เลขห้อง</label>
                <input class="form-control" th:field="*{roomNumber}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="floor">ชั้น</label>
                <input class="form-control" type="number" min="1" th:field="*{floor}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="capacity">รับผู้เช่าได้ (คน)</label>
                <select class="form-select" th:field="*{capacity}">
                    <option th:each="n : ${#numbers.sequence(1, 3)}" th:value="${n}" th:text="${n} + ' คน'"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="roomType">ประเภทห้อง</label>
                <input class="form-control" th:field="*{roomType}" list="roomTypes" placeholder="เช่น แอร์, พัดลม">
                <datalist id="roomTypes"><option value="แอร์"><option value="พัดลม"><option value="แอร์ (ห้องใหญ่)"></datalist>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="monthlyRent">ค่าเช่า/เดือน (บาท)</label>
                <input class="form-control" type="number" min="0" step="0.01" th:field="*{monthlyRent}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="status">สถานะ</label>
                <select class="form-select" th:field="*{status}">
                    <option th:each="s : ${T(th.mfu.domain.RoomStatus).values()}" th:value="${s}" th:text="${s.label}"></option>
                </select>
            </div>
        </div>
        <div class="mt-4">
            <button class="btn btn-primary" type="submit"><i data-lucide="check"></i> บันทึก</button>
            <a class="btn btn-light" th:href="@{/admin/rooms}">ยกเลิก</a>
        </div>
    </form>

    <div class="card" th:if="${tenants != null}">
        <div class="card-header">ผู้เช่าในห้องนี้</div>
        <div class="list-group list-group-flush">
            <a class="list-group-item list-group-item-action px-3" th:each="t : ${tenants}" th:href="@{/admin/tenants/{id}(id=${t.id})}">
                <span th:text="${t.fullName}"></span> <span class="text-muted small" th:text="${t.phone}"></span>
            </a>
            <div class="list-group-item text-muted px-3" th:if="${#lists.isEmpty(tenants)}">ยังไม่มีผู้เช่า</div>
        </div>
    </div>
</main>
</body>
</html>
