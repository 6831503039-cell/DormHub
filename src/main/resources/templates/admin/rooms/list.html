<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout(#{nav.section.rooms}, 'rooms', ~{::main})}">
<body>
<main th:with="buildings=${#lists.sort(#lists.toList(#sets.toSet(rooms.?[building != null].![building])))},
               freeCount=${#lists.size(rooms.?[status.name() == 'AVAILABLE'])}">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="#{nav.section.rooms}">ห้องพัก</h1>
            <p class="page-sub" th:text="#{rooms.sub(${#lists.size(rooms)}, ${freeCount})}"></p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-secondary" th:href="@{/admin/layout}"><i data-lucide="layout-grid"></i> <span th:text="#{rooms.map}">แผนผัง</span></a>
            <a class="btn btn-primary" th:href="@{/admin/rooms/new}"><i data-lucide="plus"></i> <span th:text="#{rooms.add}">เพิ่มห้อง</span></a>
        </div>
    </div>

    <th:block th:if="${#lists.isEmpty(rooms)}">
        <div class="card">
            <div th:replace="~{fragments/ui :: emptyState('door-closed', #{rooms.empty.title}, #{rooms.empty.text}, @{/admin/rooms/new}, #{rooms.add})}"></div>
        </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(rooms)}">
        <!-- search and filters (client side, see ui.js) -->
        <div class="list-toolbar" role="search">
            <label class="search-input">
                <span class="visually-hidden" th:text="#{rooms.search}">ค้นหาห้อง</span>
                <i data-lucide="search"></i>
                <input class="form-control" type="search" th:placeholder="#{rooms.search.placeholder}" data-filter-target="#roomTable" autocomplete="off">
            </label>
            <label class="visually-hidden" for="filterBuilding" th:text="#{common.building}">ตึก</label>
            <select class="form-select" id="filterBuilding" data-filter-target="#roomTable" data-filter-key="building">
                <option value="" th:text="#{common.allBuildings}">ทุกตึก</option>
                <option th:each="b : ${buildings}" th:value="${b}" th:text="#{common.buildingN(${b})}"></option>
            </select>
            <label class="visually-hidden" for="filterStatus" th:text="#{common.status}">สถานะ</label>
            <select class="form-select" id="filterStatus" data-filter-target="#roomTable" data-filter-key="status">
                <option value="" th:text="#{common.allStatuses}">ทุกสถานะ</option>
                <option th:each="s : ${T(th.mfu.domain.RoomStatus).values()}" th:value="${s.name()}" th:text="#{${s.key}}"></option>
            </select>
            <span class="list-count" data-filter-count="#roomTable" aria-live="polite"></span>
        </div>

        <!-- one card per building, closed until clicked (or opened by a search) -->
        <div id="roomTable" class="group-list">
            <details class="card group-card" data-group th:each="g : ${roomGroups}"
                     th:with="list=${g.value}, free=${#lists.size(g.value.?[status.name() == 'AVAILABLE'])}">
                <summary class="group-head">
                    <span class="group-badge" th:text="${g.key}">A</span>
                    <span class="group-title" th:text="#{common.buildingN(${g.key})}">ตึก A</span>
                    <span class="group-meta" th:text="#{rooms.groupMeta(${#lists.size(list)}, ${free})}">80 ห้อง · ว่าง 25</span>
                    <i data-lucide="chevron-down" class="group-chevron"></i>
                </summary>
                <div class="table-wrap">
                    <table class="table table-hover table-cards mb-0">
                        <thead>
                        <tr>
                            <th scope="col" th:text="#{common.room}">ห้อง</th>
                            <th scope="col" th:text="#{common.floor}">ชั้น</th>
                            <th scope="col" th:text="#{nav.tenants}">ผู้เช่า</th>
                            <th scope="col" class="text-end" th:text="#{rooms.col.rent}">ค่าเช่า/เดือน</th>
                            <th scope="col" th:text="#{common.status}">สถานะ</th>
                            <th scope="col"><span class="visually-hidden" th:text="#{common.actions}">จัดการ</span></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${list}" data-row
                            th:with="occ=${occupants.getOrDefault(r.id, 0L)}"
                            th:attr="data-building=${r.building},data-status=${r.status.name()}">
                            <td class="td-title">
                                <span class="d-block fw-semibold" th:text="${r.roomNumber}"></span>
                                <span class="item-meta" th:text="${r.roomType}"></span>
                            </td>
                            <td th:text="${r.floor != null} ? #{common.floorN(${r.floor})} : '-'"></td>
                            <td>
                                <span class="cell">
                                    <span class="num" th:text="${occ} + ' / ' + ${r.capacity}"></span>
                                    <span class="tag" th:if="${r.capacity != null and occ >= r.capacity}" th:text="#{rooms.full}">เต็ม</span>
                                </span>
                            </td>
                            <td class="text-end num" th:text="${r.monthlyRent != null} ? ${#numbers.formatDecimal(r.monthlyRent, 1, 'COMMA', 0, 'POINT')} : '-'"></td>
                            <td><span th:replace="~{fragments/ui :: status(${r.status.badge}, #{${r.status.key}})}"></span></td>
                            <td class="td-actions">
                                <a class="btn btn-soft btn-icon btn-sm" th:href="@{/admin/rooms/{id}(id=${r.id})}"
                                   th:attr="aria-label=#{rooms.editN(${r.roomNumber})}" th:title="#{common.edit}"><i data-lucide="pencil"></i></a>
                                <a th:if="${occ == 0}" class="btn btn-ghost-danger btn-icon btn-sm" th:href="@{/admin/rooms/{id}/delete(id=${r.id})}"
                                   th:attr="aria-label=#{rooms.deleteN(${r.roomNumber})},data-confirm=#{rooms.delete.confirm(${r.roomNumber})},data-confirm-title=#{rooms.deleteN(${r.roomNumber})}"
                                   th:title="#{common.delete}"><i data-lucide="trash-2"></i></a>
                                <span th:unless="${occ == 0}" class="btn btn-ghost btn-icon btn-sm disabled" aria-disabled="true"
                                      th:title="#{rooms.cannotDelete}"><i data-lucide="trash-2"></i></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </details>
        </div>
        <div class="card" data-filter-empty="#roomTable" hidden>
            <div th:replace="~{fragments/ui :: emptyState('search-x', #{rooms.noMatch}, #{common.noMatch.text}, null, null)}"></div>
        </div>
    </th:block>
</main>
</body>
</html>
