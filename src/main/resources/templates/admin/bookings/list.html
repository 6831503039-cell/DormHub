<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout('คำขอจอง', 'bookings', ~{::main})}">
<body>
<main>
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <div>
            <h1 class="page-title">คำขอจองห้อง</h1>
            <div class="text-muted small">ส่งมาจากหน้าแผนผัง 3D สำหรับคนทั่วไป · รอติดต่อกลับ <b th:text="${pendingCount}">0</b> รายการ</div>
        </div>
        <a class="btn btn-light" th:href="@{/explore}" target="_blank" rel="noopener"><i data-lucide="external-link"></i> เปิดหน้าจองห้อง</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>วันที่ส่ง</th><th>ห้อง</th><th>ผู้ขอจอง</th><th>ติดต่อ</th><th>เข้าอยู่</th><th>ข้อความ</th><th>สถานะ</th><th></th></tr></thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td class="text-nowrap small" th:text="${#temporals.format(b.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="fw-medium"><a th:href="@{/admin/rooms/{id}(id=${b.room.id})}" th:text="${b.room.roomNumber}"></a></td>
                    <td th:text="${b.fullName}"></td>
                    <td class="small">
                        <div th:text="${b.phone}"></div>
                        <div class="text-muted" th:if="${b.email}" th:text="${b.email}"></div>
                    </td>
                    <td class="text-nowrap" th:text="${b.moveInDate != null} ? ${#temporals.format(b.moveInDate, 'dd/MM/yyyy')} : '-'"></td>
                    <td class="small text-muted" style="max-width: 220px" th:text="${b.note ?: '-'}"></td>
                    <td><span th:class="'badge soft-' + ${b.status.badge}" th:text="${b.status.label}"></span></td>
                    <td class="text-end text-nowrap">
                        <form class="d-inline" th:action="@{/admin/bookings/{id}/status(id=${b.id})}" method="post" th:if="${b.status.name() != 'CONFIRMED'}">
                            <input type="hidden" name="status" value="CONFIRMED">
                            <button class="btn btn-soft btn-sm" type="submit"><i data-lucide="check"></i> ยืนยัน</button>
                        </form>
                        <form class="d-inline" th:action="@{/admin/bookings/{id}/status(id=${b.id})}" method="post" th:if="${b.status.name() != 'CANCELLED'}">
                            <input type="hidden" name="status" value="CANCELLED">
                            <button class="btn btn-light btn-sm" type="submit"><i data-lucide="x"></i> ยกเลิก</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(bookings)}"><td colspan="8" class="text-center text-muted py-4">ยังไม่มีคำขอจอง</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
