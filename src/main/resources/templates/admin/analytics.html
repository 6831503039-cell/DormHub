<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout(#{nav.analytics}, 'analytics', ~{::main})}">
<body>
<main th:with="seasonTone=${ {'HOT': 'warning', 'RAINY': 'info', 'COOL': ''} }">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="#{nav.analytics}">วิเคราะห์ค่าไฟ</h1>
            <p class="page-sub" th:text="#{analytics.sub}">แนวโน้ม 12 เดือนล่าสุด และเปรียบเทียบตาม 3 ฤดูของไทย</p>
        </div>
    </div>

    <!-- rooms that need a look come first -->
    <section class="card mb-4" th:unless="${#lists.isEmpty(abnormal)}" aria-labelledby="abnormalTitle">
        <div class="card-header">
            <h2 class="h2 mb-0" id="abnormalTitle" th:text="#{analytics.abnormal}">ห้องที่ใช้ไฟสูงผิดปกติ</h2>
            <span class="badge status-danger" th:text="#{analytics.roomsN(${#lists.size(abnormal)})}"></span>
        </div>
        <p class="form-text pt-3 mb-0" th:text="#{analytics.abnormal.rule}">สูงกว่าค่าเฉลี่ย 3 เดือนก่อนหน้าเกิน 30%</p>
        <ul class="list-plain">
            <li th:each="a : ${abnormal}">
                <div>
                    <div class="item-title" th:text="#{common.roomN(${a.room.roomNumber})}"></div>
                    <div class="item-meta" th:text="${a.billMonth} + ' · ' + #{analytics.unitsVsAvg(${a.units}, ${a.average})}"></div>
                </div>
                <span class="badge status-danger item-end" th:text="'+' + ${a.percentAbove} + '%'"></span>
            </li>
        </ul>
    </section>

    <!-- average units per room-month in each season -->
    <div class="figures cols-3">
        <div class="kpi" th:each="entry : ${seasonAverages}" th:classappend="${seasonTone[entry.key.name()] != ''} ? 'tone-' + ${seasonTone[entry.key.name()]}">
            <span class="kpi-head">
                <span th:text="#{${entry.key.key}} + ' · ' + #{${entry.key.key + '.months'}}"></span>
            </span>
            <span class="kpi-value"><span th:text="${entry.value}">0</span> <small th:text="#{common.units}">หน่วย</small></span>
            <span class="kpi-meta" th:text="#{analytics.perRoomMonth}">เฉลี่ยต่อห้องต่อเดือน</span>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-8">
            <section class="card h-100" aria-labelledby="monthlyTitle">
                <div class="card-header"><h2 class="h2 mb-0" id="monthlyTitle" th:text="#{analytics.monthly}">หน่วยไฟรวมทุกห้อง รายเดือน</h2></div>
                <div class="card-body">
                    <div class="legend mb-3">
                        <span><span class="dot warning"></span><span th:text="#{season.HOT}">ฤดูร้อน</span></span>
                        <span><span class="dot info"></span><span th:text="#{season.RAINY}">ฤดูฝน</span></span>
                        <span><span class="dot"></span><span th:text="#{season.COOL}">ฤดูหนาว</span></span>
                    </div>
                    <div class="chart-box"><canvas id="monthlyChart" role="img" th:aria-label="#{analytics.monthly.aria}"></canvas></div>
                </div>
            </section>
        </div>
        <div class="col-lg-4">
            <section class="card h-100" aria-labelledby="seasonTitle">
                <div class="card-header"><h2 class="h2 mb-0" id="seasonTitle" th:text="#{analytics.season}">เฉลี่ยต่อห้องตามฤดู</h2></div>
                <div class="card-body">
                    <div class="chart-box"><canvas id="seasonChart" role="img" th:aria-label="#{analytics.season.aria}"></canvas></div>
                </div>
            </section>
        </div>
        <div class="col-12">
            <section class="card" aria-labelledby="costTitle">
                <div class="card-header"><h2 class="h2 mb-0" id="costTitle" th:text="#{analytics.cost}">ยอดเรียกเก็บรวม เทียบกับค่าไฟ (บาท)</h2></div>
                <div class="card-body">
                    <div class="chart-box sm"><canvas id="costChart" role="img" th:aria-label="#{analytics.cost.aria}"></canvas></div>
                </div>
            </section>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script th:inline="javascript">
        const months = /*[[${months}]]*/ [];
        const units = /*[[${units}]]*/ [];
        const electricCost = /*[[${electricCost}]]*/ [];
        const totalBilled = /*[[${totalBilled}]]*/ [];
        const monthSeasons = /*[[${monthSeasons}]]*/ [];
        const seasonLabels = /*[[${seasonLabels}]]*/ [];
        const seasonValues = /*[[${seasonValues}]]*/ [];

        // colours come from the design tokens in app.css
        const css = getComputedStyle(document.documentElement);
        const token = name => css.getPropertyValue(name).trim();
        const seasonColor = { HOT: token('--s-warning'), RAINY: token('--s-info'), COOL: token('--s-neutral') };
        Chart.defaults.font.family = token('--font');
        Chart.defaults.color = token('--c-muted');
        Chart.defaults.maintainAspectRatio = false;
        const grid = { color: token('--c-border') };
        const baht = v => Number(v).toLocaleString(dhT('th-TH', 'en-US'), { maximumFractionDigits: 0 });

        new Chart(document.getElementById('monthlyChart'), {
            type: 'bar',
            data: { labels: months, datasets: [{ label: /*[[#{analytics.series.units}]]*/ 'หน่วยไฟฟ้า', data: units,
                backgroundColor: monthSeasons.map(s => seasonColor[s]), borderRadius: 4, maxBarThickness: 36 }] },
            options: { plugins: { legend: { display: false } },
                scales: { y: { grid, beginAtZero: true }, x: { grid: { display: false } } } }
        });
        new Chart(document.getElementById('seasonChart'), {
            type: 'bar',
            data: { labels: seasonLabels, datasets: [{ label: /*[[#{analytics.series.perRoom}]]*/ 'หน่วย/ห้อง/เดือน', data: seasonValues,
                backgroundColor: [seasonColor.HOT, seasonColor.RAINY, seasonColor.COOL], borderRadius: 4, maxBarThickness: 48 }] },
            options: { plugins: { legend: { display: false } },
                scales: { y: { grid, beginAtZero: true }, x: { grid: { display: false } } } }
        });
        new Chart(document.getElementById('costChart'), {
            type: 'line',
            data: { labels: months, datasets: [
                { label: /*[[#{analytics.series.billed}]]*/ 'ยอดเรียกเก็บรวม', data: totalBilled, borderColor: token('--c-primary'), backgroundColor: token('--c-primary'), pointRadius: 3, tension: .3 },
                { label: /*[[#{analytics.series.electric}]]*/ 'ค่าไฟ', data: electricCost, borderColor: token('--s-warning'), backgroundColor: token('--s-warning'), pointRadius: 3, tension: .3 }
            ] },
            options: { interaction: { mode: 'index', intersect: false },
                plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } },
                    tooltip: { callbacks: { label: c => c.dataset.label + ': ฿' + baht(c.parsed.y) } } },
                scales: { y: { grid, ticks: { callback: baht } }, x: { grid: { display: false } } } }
        });
    </script>
</main>
</body>
</html>
