<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout('ข้อมูลบิล', 'bills', ~{::main})}">
<body>
<main style="max-width: 760px">
    <h1 class="page-title mb-3" th:text="${bill.id == null} ? 'ออกบิล / จดมิเตอร์' : 'แก้ไขบิล'">ออกบิล</h1>

    <form class="card card-body" th:action="@{/admin/bills}" th:object="${bill}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="room">ห้อง</label>
                <select class="form-select" id="room" name="room" required>
                    <option value="">เลือกห้อง</option>
                    <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomNumber} + ' · ฿' + ${#numbers.formatDecimal(r.monthlyRent, 1, 'COMMA', 0, 'POINT')}"
                            th:selected="${bill.room != null and bill.room.id == r.id}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="billMonth">ประจำเดือน</label>
                <input class="form-control" type="month" th:field="*{billMonth}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="dueDate">ครบกำหนดชำระ</label>
                <input class="form-control" type="date" th:field="*{dueDate}" title="เว้นว่าง = วันที่ 5 ของเดือนถัดไป">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="rent">ค่าเช่า (บาท)</label>
                <input class="form-control" type="number" min="0" step="0.01" th:field="*{rent}" placeholder="เว้นว่าง = ใช้ค่าเช่าของห้อง">
            </div>
            <div class="col-12"><hr class="my-1"></div>
            <div class="col-md-3">
                <label class="form-label" for="electricUnits">ค่าไฟ (หน่วย)</label>
                <input class="form-control" type="number" min="0" th:field="*{electricUnits}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="electricRate">บาท/หน่วย</label>
                <input class="form-control" type="number" min="0" step="0.01" th:field="*{electricRate}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="waterUnits">ค่าน้ำ (หน่วย)</label>
                <input class="form-control" type="number" min="0" th:field="*{waterUnits}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="waterRate">บาท/หน่วย</label>
                <input class="form-control" type="number" min="0" step="0.01" th:field="*{waterRate}" required>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{paid}">
                    <label class="form-check-label" th:for="${#ids.prev('paid')}">ชำระแล้ว</label>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <button class="btn btn-primary" type="submit"><i data-lucide="check"></i> บันทึก</button>
            <a class="btn btn-light" th:href="@{/admin/bills}">ยกเลิก</a>
        </div>
    </form>
</main>
</body>
</html>
