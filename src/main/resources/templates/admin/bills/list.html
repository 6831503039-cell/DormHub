<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout('บิลค่าเช่า', 'bills', ~{::main})}">
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="page-title mb-0">บิลค่าเช่า</h1>
        <a class="btn btn-primary" th:href="@{/admin/bills/new}"><i data-lucide="plus"></i> ออกบิล / จดมิเตอร์</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr><th>เดือน</th><th>ห้อง</th><th class="text-end">ค่าเช่า</th><th class="text-end">ค่าน้ำ</th><th class="text-end">ค่าไฟ</th>
                    <th class="text-end">รวม</th><th class="text-end">หาร/คน</th><th>ครบกำหนด</th><th>สถานะ</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bills}">
                    <td th:text="${b.billMonth}"></td>
                    <td class="fw-medium" th:text="${b.room.roomNumber}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(b.rent, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td class="text-end"><span th:text="${#numbers.formatDecimal(b.waterCost, 1, 'COMMA', 2, 'POINT')}"></span>
                        <div class="small text-muted" th:text="${b.waterUnits} + ' หน่วย'"></div></td>
                    <td class="text-end"><span th:text="${#numbers.formatDecimal(b.electricCost, 1, 'COMMA', 2, 'POINT')}"></span>
                        <div class="small text-muted" th:text="${b.electricUnits} + ' หน่วย'"></div></td>
                    <td class="text-end fw-medium" th:text="${#numbers.formatDecimal(b.total, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td class="text-end">
                        <span th:text="${#numbers.formatDecimal(@billingService.shareOf(b), 1, 'COMMA', 2, 'POINT')}"></span>
                        <div class="small text-muted" th:text="${@billingService.occupants(b.room)} + ' คน'"></div>
                    </td>
                    <td th:text="${b.dueDate != null} ? ${#temporals.format(b.dueDate, 'dd/MM/yy')} : '-'"></td>
                    <td>
                        <span th:if="${b.paid}" class="badge soft-success">ชำระแล้ว</span>
                        <span th:unless="${b.paid}" class="badge soft-danger">ค้างชำระ</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-soft" th:href="@{/admin/bills/{id}/pay(id=${b.id})}" th:text="${b.paid} ? 'ยกเลิกชำระ' : 'รับชำระ'"></a>
                        <a class="btn btn-light btn-icon" th:href="@{/admin/bills/{id}(id=${b.id})}" title="แก้ไข"><i data-lucide="pencil"></i></a>
                        <a class="btn btn-light btn-icon text-danger" th:href="@{/admin/bills/{id}/delete(id=${b.id})}" title="ลบ"
                           onclick="return confirm('ยืนยันการลบบิลนี้? สลิปที่แนบไว้จะถูกลบด้วย')"><i data-lucide="trash-2"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(bills)}"><td colspan="10" class="text-center text-muted py-4">ยังไม่มีบิล</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
