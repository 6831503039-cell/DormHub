<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout(#{nav.bills}, 'bills', ~{::main})}">
<body>
<main th:with="today=${#temporals.createToday()}, DAYS=${T(java.time.temporal.ChronoUnit).DAYS},
               unpaid=${bills.?[!paid]},
               overdueCount=${#lists.size(bills.?[!paid and dueDate != null and dueDate.isBefore(#vars.today)])},
               months=${#lists.sort(#lists.toList(#sets.toSet(bills.![billMonth])))}">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="#{nav.bills}">บิลค่าเช่า</h1>
            <p class="page-sub" th:if="${!#lists.isEmpty(bills) and #lists.isEmpty(unpaid)}" th:text="#{billList.allPaid}">ทุกบิลชำระครบแล้ว</p>
            <p class="page-sub" th:unless="${#lists.isEmpty(unpaid)}"
               th:text="#{bills.unpaidCount(${#lists.size(unpaid)})} + ' · ฿' + ${#numbers.formatDecimal(#aggregates.sum(unpaid.![total]), 1, 'COMMA', 0, 'POINT')} + (${overdueCount > 0} ? ' · ' + #{billList.overdueCount(${overdueCount})} : '')"></p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/bills/new}"><span th:text="#{bill.new}">ออกบิล / จดมิเตอร์</span></a>
    </div>

    <th:block th:if="${#lists.isEmpty(bills)}">
        <div class="card">
            <div th:replace="~{fragments/ui :: emptyState(#{bills.none}, #{billList.empty.text}, @{/admin/bills/new}, #{billList.create})}"></div>
        </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(bills)}">
        <div class="list-toolbar" role="search">
            <label class="search-input">
                <span class="visually-hidden" th:text="#{billList.search}">ค้นหาบิล</span>
                <i data-lucide="search"></i>
                <input class="form-control" type="search" th:placeholder="#{billList.search.placeholder}" data-filter-target="#billTable" autocomplete="off">
            </label>
            <label class="visually-hidden" for="filterMonth" th:text="#{common.month}">เดือน</label>
            <select class="form-select" id="filterMonth" data-filter-target="#billTable" data-filter-key="month">
                <option value="" th:text="#{billList.allMonths}">ทุกเดือน</option>
                <option th:each="m, st : ${months}" th:with="month=${months[#lists.size(months) - 1 - st.index]}"
                        th:value="${month}" th:text="${month}"></option>
            </select>
            <label class="visually-hidden" for="filterStatus" th:text="#{common.status}">สถานะ</label>
            <select class="form-select" id="filterStatus" data-filter-target="#billTable" data-filter-key="status">
                <option value="" th:text="#{common.allStatuses}">ทุกสถานะ</option>
                <option value="unpaid" th:text="#{common.unpaid}">ค้างชำระ</option>
                <option value="overdue" th:text="#{common.overdue}">เลยกำหนด</option>
                <option value="paid" th:text="#{common.paid}">ชำระแล้ว</option>
            </select>
            <span class="list-count" data-filter-count="#billTable" aria-live="polite"></span>
        </div>

        <div class="card">
            <div class="table-wrap">
                <table class="table table-hover table-cards" id="billTable">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{common.room}">ห้อง</th>
                        <th scope="col" th:text="#{common.month}">เดือน</th>
                        <th scope="col" th:text="#{billList.col.charges}">ค่าใช้จ่าย</th>
                        <th scope="col" class="text-end" th:text="#{billList.col.total}">รวม (บาท)</th>
                        <th scope="col" class="text-end" th:text="#{billList.col.perPerson}">ต่อคน</th>
                        <th scope="col" th:text="#{bill.due}">ครบกำหนด</th>
                        <th scope="col" th:text="#{common.status}">สถานะ</th>
                        <th scope="col"><span class="visually-hidden" th:text="#{common.actions}">จัดการ</span></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="b : ${bills}" data-row
                        th:with="people=${@billingService.occupants(b.room)},
                                 overdue=${!b.paid and b.dueDate != null and b.dueDate.isBefore(today)}"
                        th:attr="data-month=${b.billMonth},data-status=(${b.paid} ? 'paid' : (${overdue} ? 'unpaid overdue' : 'unpaid'))">
                        <td class="td-title">
                            <span class="d-block fw-semibold" th:text="${b.room.roomNumber}"></span>
                            <span class="item-meta" th:text="#{billList.splitN(${people})}"></span>
                        </td>
                        <td class="num nowrap" th:text="${b.billMonth}"></td>
                        <td>
                            <span class="cell item-meta">
                                <span th:text="#{billList.rent(${#numbers.formatDecimal(b.rent, 1, 'COMMA', 0, 'POINT')})}"></span>
                                <span th:text="'· ' + #{billList.electric(${#numbers.formatDecimal(b.electricCost, 1, 'COMMA', 0, 'POINT')}, ${b.electricUnits})}"></span>
                                <span th:text="'· ' + #{billList.water(${#numbers.formatDecimal(b.waterCost, 1, 'COMMA', 0, 'POINT')})}"></span>
                            </span>
                        </td>
                        <td class="text-end num fw-semibold" th:text="${#numbers.formatDecimal(b.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="text-end num" th:text="${#numbers.formatDecimal(@billingService.shareOf(b), 1, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <span class="cell text-nowrap">
                                <span class="num" th:text="${b.dueDate != null} ? ${#temporals.format(b.dueDate, 'dd/MM/yyyy')} : '-'"></span>
                                <span th:if="${overdue}" class="badge status-danger" th:text="#{common.daysLate(${DAYS.between(b.dueDate, today)})}"></span>
                            </span>
                        </td>
                        <td>
                            <span th:if="${b.paid}" class="badge status-success" th:text="#{common.paid}">ชำระแล้ว</span>
                            <span th:unless="${b.paid}" class="badge status-danger" th:text="#{common.unpaid}">ค้างชำระ</span>
                        </td>
                        <td class="td-actions">
                            <a th:unless="${b.paid}" class="btn btn-soft btn-sm" th:href="@{/admin/bills/{id}/pay(id=${b.id})}"
                               th:attr="aria-label=#{billList.markPaidN(${b.room.roomNumber}, ${b.billMonth})}"><span th:text="#{billList.markPaid}">รับชำระ</span></a>
                            <a th:if="${b.paid}" class="btn btn-ghost btn-sm" th:href="@{/admin/bills/{id}/pay(id=${b.id})}"
                               th:attr="aria-label=#{billList.unpayN(${b.room.roomNumber}, ${b.billMonth})},data-confirm=#{billList.unpay.confirm(${b.room.roomNumber}, ${b.billMonth})},data-confirm-title=#{billList.unpay.title},data-confirm-ok=#{billList.unpay.ok}"
                               data-confirm-tone="primary" th:text="#{billList.unpay}">ยกเลิก</a>
                            <a class="btn btn-ghost btn-icon btn-sm" th:href="@{/admin/bills/{id}(id=${b.id})}"
                               th:attr="aria-label=#{billList.editN(${b.room.roomNumber})}" th:title="#{common.edit}"><i data-lucide="pencil"></i></a>
                            <a class="btn btn-ghost-danger btn-icon btn-sm" th:href="@{/admin/bills/{id}/delete(id=${b.id})}"
                               th:attr="aria-label=#{billList.deleteN(${b.room.roomNumber}, ${b.billMonth})},data-confirm=#{billList.delete.confirm},data-confirm-title=#{billList.deleteN(${b.room.roomNumber}, ${b.billMonth})}"
                               th:title="#{common.delete}"><i data-lucide="trash-2"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div data-filter-empty="#billTable" hidden>
                <div th:replace="~{fragments/ui :: emptyState(#{billList.noMatch}, #{common.noMatch.text}, null, null)}"></div>
            </div>
        </div>
    </th:block>
</main>
</body>
</html>
