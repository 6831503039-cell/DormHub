<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout('ข้อมูลผู้เช่า', 'tenants', ~{::main})}">
<body>
<main class="form-page">
    <a class="back-link" th:href="@{/admin/tenants}"><i data-lucide="chevron-left"></i> ผู้เช่า</a>
    <div class="page-header">
        <h1 class="page-title" th:text="${tenant.id == null} ? 'เพิ่มผู้เช่า' : ${tenant.fullName}">เพิ่มผู้เช่า</h1>
    </div>

    <form class="card card-body" th:action="@{/admin/tenants}" th:object="${tenant}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-section">
            <h2 class="form-section-title">ข้อมูลผู้เช่า</h2>
            <div class="row g-3">
                <div class="col-sm-6">
                    <label class="form-label" for="firstName">ชื่อ</label>
                    <input class="form-control" th:field="*{firstName}" required autocomplete="given-name">
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="lastName">นามสกุล</label>
                    <input class="form-control" th:field="*{lastName}" required autocomplete="family-name">
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="phone">โทรศัพท์ <span class="optional">(ไม่บังคับ)</span></label>
                    <input class="form-control" type="tel" inputmode="tel" th:field="*{phone}" placeholder="08x-xxx-xxxx" autocomplete="tel">
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="email">อีเมล <span class="optional">(ไม่บังคับ)</span></label>
                    <input class="form-control" type="email" th:field="*{email}" autocomplete="email">
                    <div class="form-text">ถ้าผู้เช่าสมัครแอปด้วยอีเมลนี้ จะเห็นห้องและบิลของตัวเอง</div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2 class="form-section-title">ห้องและสัญญา</h2>
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label" for="room">ห้อง <span class="optional">(ไม่บังคับ)</span></label>
                    <select class="form-select" id="room" name="room">
                        <option value="">ยังไม่ระบุห้อง</option>
                        <option th:each="r : ${rooms}" th:value="${r.id}"
                                th:text="${r.roomNumber} + ' · ' + ${r.status.label} + ' · รับได้ ' + ${r.capacity} + ' คน'"
                                th:selected="${tenant.room != null and tenant.room.id == r.id}"></option>
                    </select>
                    <div class="form-text">ถ้าห้องเต็มแล้ว ระบบจะไม่ให้บันทึก</div>
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="checkInDate">วันที่เข้าพัก <span class="optional">(ไม่บังคับ)</span></label>
                    <input class="form-control" type="date" th:field="*{checkInDate}">
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="contractEndDate">วันหมดสัญญา <span class="optional">(ไม่บังคับ)</span></label>
                    <input class="form-control" type="date" th:field="*{contractEndDate}">
                    <div class="form-text">เหลือไม่เกิน 60 วัน ห้องจะขึ้นเป็น "ใกล้หมดสัญญา" และเปิดให้จองล่วงหน้าบนแผนผัง 3D</div>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary" type="submit"><i data-lucide="check"></i> บันทึก</button>
            <a class="btn btn-secondary" th:href="@{/admin/tenants}">ยกเลิก</a>
        </div>
    </form>
</main>
</body>
</html>
