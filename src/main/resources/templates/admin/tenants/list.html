<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout(#{nav.tenants}, 'tenants', ~{::main})}">
<body>
<main th:with="today=${#temporals.createToday()}, DAYS=${T(java.time.temporal.ChronoUnit).DAYS},
               soonDays=${T(th.mfu.service.RoomMapService).SOON_DAYS},
               buildings=${#lists.sort(#lists.toList(#sets.toSet(tenants.?[room != null and room.building != null].![room.building])))},
               appCount=${#lists.size(tenants.?[email != null and #vars.accountEmails.contains(email.toLowerCase())])}">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="#{nav.tenants}">ผู้เช่า</h1>
            <p class="page-sub" th:text="#{tenants.sub(${#lists.size(tenants)}, ${appCount})}"></p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/tenants/new}"><i data-lucide="user-plus"></i> <span th:text="#{tenants.add}">เพิ่มผู้เช่า</span></a>
    </div>

    <th:block th:if="${#lists.isEmpty(tenants)}">
        <div class="card">
            <div th:replace="~{fragments/ui :: emptyState('users', #{tenants.empty.title}, #{tenants.empty.text}, @{/admin/tenants/new}, #{tenants.add})}"></div>
        </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(tenants)}">
        <div class="list-toolbar" role="search">
            <label class="search-input">
                <span class="visually-hidden" th:text="#{tenants.search}">ค้นหาผู้เช่า</span>
                <i data-lucide="search"></i>
                <input class="form-control" type="search" th:placeholder="#{tenants.search.placeholder}" data-filter-target="#tenantTable" autocomplete="off">
            </label>
            <label class="visually-hidden" for="filterBuilding" th:text="#{common.building}">ตึก</label>
            <select class="form-select" id="filterBuilding" data-filter-target="#tenantTable" data-filter-key="building">
                <option value="" th:text="#{common.allBuildings}">ทุกตึก</option>
                <option th:each="b : ${buildings}" th:value="${b}" th:text="#{common.buildingN(${b})}"></option>
                <option value="none" th:text="#{common.noRoom}">ไม่มีห้อง</option>
            </select>
            <label class="visually-hidden" for="filterContract" th:text="#{tenants.contract}">สัญญา</label>
            <select class="form-select" id="filterContract" data-filter-target="#tenantTable" data-filter-key="contract">
                <option value="" th:text="#{tenants.contract}">สัญญา</option>
                <option value="soon" th:text="#{tenants.contract.soon(${soonDays})}">ใกล้หมด</option>
                <option value="expired" th:text="#{tenants.contract.expired}">หมดแล้ว</option>
            </select>
            <label class="visually-hidden" for="filterApp" th:text="#{tenants.appAccount}">บัญชีแอป</label>
            <select class="form-select" id="filterApp" data-filter-target="#tenantTable" data-filter-key="app">
                <option value="" th:text="#{tenants.app}">แอป</option>
                <option value="yes" th:text="#{tenants.app.yes}">ใช้แอปแล้ว</option>
                <option value="no" th:text="#{tenants.app.no}">ยังไม่สมัคร</option>
            </select>
            <span class="list-count" data-filter-count="#tenantTable" aria-live="polite"></span>
        </div>
        <p class="form-text d-flex gap-2 mb-3">
            <i data-lucide="info"></i>
            <span th:text="#{tenants.appHint}">ผู้เช่าที่สมัครแอปด้วยอีเมลเดียวกับในรายการนี้ จะเห็นห้อง บิล และเพื่อนร่วมห้องของตัวเองอัตโนมัติ</span>
        </p>

        <!-- one card per building, closed until clicked (or opened by a search); tenants without a room come last -->
        <div id="tenantTable" class="group-list">
            <details class="card group-card" data-group th:each="g : ${tenantGroups}">
                <summary class="group-head">
                    <span class="group-badge" th:text="${g.key == 'none'} ? '-' : ${g.key}">A</span>
                    <span class="group-title" th:text="${g.key == 'none'} ? #{common.noRoom} : #{common.buildingN(${g.key})}">ตึก A</span>
                    <span class="group-meta" th:text="#{tenants.groupMeta(${#lists.size(g.value)})}">60 คน</span>
                    <i data-lucide="chevron-down" class="group-chevron"></i>
                </summary>
                <div class="table-wrap">
                    <table class="table table-hover table-cards mb-0">
                        <thead>
                        <tr>
                            <th scope="col" th:text="#{tenants.col.tenant}">ผู้เช่า</th>
                            <th scope="col" th:text="#{common.room}">ห้อง</th>
                            <th scope="col" th:text="#{common.phone}">โทรศัพท์</th>
                            <th scope="col" th:text="#{tenants.col.checkIn}">เข้าพัก</th>
                            <th scope="col" th:text="#{tenants.col.contractEnd}">สัญญาถึง</th>
                            <th scope="col" th:text="#{tenants.appAccount}">บัญชีแอป</th>
                            <th scope="col"><span class="visually-hidden" th:text="#{common.actions}">จัดการ</span></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${g.value}" data-row
                            th:with="hasApp=${t.email != null and accountEmails.contains(t.email.toLowerCase())},
                                     daysLeft=${t.contractEndDate != null} ? ${DAYS.between(today, t.contractEndDate)} : null,
                                     contract=${daysLeft == null} ? 'none' : (${daysLeft < 0} ? 'expired' : (${daysLeft <= soonDays} ? 'soon' : 'ok'))"
                            th:attr="data-building=(${t.room != null} ? ${t.room.building} : 'none'),data-app=(${hasApp} ? 'yes' : 'no'),data-contract=${contract}">
                            <td class="td-title">
                                <span class="d-block fw-semibold" th:text="${t.fullName}"></span>
                                <span class="item-meta" th:text="${t.email != null} ? ${t.email} : #{common.noEmail}"></span>
                            </td>
                            <td>
                                <span th:if="${t.room != null}" class="cell">
                                    <span class="fw-medium" th:text="${t.room.roomNumber}"></span>
                                    <span class="item-meta" th:text="#{common.buildingN(${t.room.building})}"></span>
                                </span>
                                <span th:if="${t.room == null}" class="text-muted" th:text="#{common.noRoom}">ไม่มีห้อง</span>
                            </td>
                            <td>
                                <a th:if="${t.phone != null and !#strings.isEmpty(t.phone)}" class="link-quiet num text-nowrap" th:href="'tel:' + ${#strings.replace(t.phone, '-', '')}" th:text="${t.phone}"></a>
                                <span th:unless="${t.phone != null and !#strings.isEmpty(t.phone)}" class="text-muted">-</span>
                            </td>
                            <td class="num text-nowrap" th:text="${t.checkInDate != null} ? ${#temporals.format(t.checkInDate, 'dd/MM/yyyy')} : '-'"></td>
                            <td>
                                <span class="cell text-nowrap" th:if="${t.contractEndDate != null}">
                                    <span class="num" th:text="${#temporals.format(t.contractEndDate, 'dd/MM/yyyy')}"></span>
                                    <th:block th:if="${contract == 'soon'}"><span th:replace="~{fragments/ui :: status('soon', #{tenants.daysLeft(${daysLeft})})}"></span></th:block>
                                    <th:block th:if="${contract == 'expired'}"><span th:replace="~{fragments/ui :: status('danger', #{tenants.contract.expired})}"></span></th:block>
                                </span>
                                <span th:if="${t.contractEndDate == null}" class="text-muted">-</span>
                            </td>
                            <td>
                                <th:block th:if="${hasApp}"><span th:replace="~{fragments/ui :: status('success', #{tenants.app.yes})}"></span></th:block>
                                <th:block th:unless="${hasApp}"><span th:replace="~{fragments/ui :: status('neutral', #{tenants.app.no})}"></span></th:block>
                            </td>
                            <td class="td-actions">
                                <a class="btn btn-soft btn-icon btn-sm" th:href="@{/admin/tenants/{id}(id=${t.id})}"
                                   th:attr="aria-label=#{tenants.editN(${t.fullName})}" th:title="#{common.edit}"><i data-lucide="pencil"></i></a>
                                <a class="btn btn-ghost-danger btn-icon btn-sm" th:href="@{/admin/tenants/{id}/delete(id=${t.id})}"
                                   th:attr="aria-label=#{tenants.deleteN(${t.fullName})},data-confirm=#{tenants.delete.confirm},data-confirm-title=#{tenants.deleteTitle(${t.fullName})}"
                                   th:title="#{common.delete}"><i data-lucide="trash-2"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </details>
        </div>
        <div class="card" data-filter-empty="#tenantTable" hidden>
            <div th:replace="~{fragments/ui :: emptyState('search-x', #{tenants.noMatch}, #{common.noMatch.text}, null, null)}"></div>
        </div>
    </th:block>
</main>
</body>
</html>
