<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout('ผู้เช่า', 'tenants', ~{::main})}">
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="page-title mb-0">ผู้เช่า</h1>
            <div class="text-muted small">ผู้เช่าที่สมัครบัญชีด้วยอีเมลเดียวกับในรายการนี้ จะเข้าแอปและเห็นห้องของตัวเองได้</div>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/tenants/new}"><i data-lucide="user-plus"></i> เพิ่มผู้เช่า</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>ชื่อ-นามสกุล</th><th>ห้อง</th><th>โทรศัพท์</th><th>อีเมล</th><th>บัญชีแอป</th><th>วันที่เข้าพัก</th><th></th></tr></thead>
                <tbody>
                <tr th:each="t : ${tenants}">
                    <td class="fw-medium" th:text="${t.fullName}"></td>
                    <td th:text="${t.room != null} ? ${t.room.roomNumber} : '-'"></td>
                    <td th:text="${t.phone}"></td>
                    <td th:text="${t.email}"></td>
                    <td>
                        <span th:if="${t.email != null and accountEmails.contains(t.email.toLowerCase())}" class="badge soft-success">ใช้งานแล้ว</span>
                        <span th:unless="${t.email != null and accountEmails.contains(t.email.toLowerCase())}" class="badge soft-secondary">ยังไม่สมัคร</span>
                    </td>
                    <td th:text="${t.checkInDate != null} ? ${#temporals.format(t.checkInDate, 'dd/MM/yyyy')} : '-'"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-light btn-icon" th:href="@{/admin/tenants/{id}(id=${t.id})}" title="แก้ไข"><i data-lucide="pencil"></i></a>
                        <a class="btn btn-light btn-icon text-danger" th:href="@{/admin/tenants/{id}/delete(id=${t.id})}" title="ลบ"
                           onclick="return confirm('ยืนยันการลบผู้เช่านี้?')"><i data-lucide="trash-2"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tenants)}"><td colspan="7" class="text-center text-muted py-4">ยังไม่มีผู้เช่า</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
