<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout(#{nav.feedback}, 'feedback', ~{::main})}">
<body>
<main th:with="unread=${#lists.size(feedbacks.?[!readByOwner])},
               categories=${T(th.mfu.domain.Feedback).CATEGORIES}">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="#{feedback.title}">ฟีดแบ็กจากผู้เช่า</h1>
            <p class="page-sub" th:unless="${#lists.isEmpty(feedbacks)}"
               th:text="#{feedback.sub(${#numbers.formatDecimal(#aggregates.avg(feedbacks.![rating]), 1, 1)}, ${unread})}"></p>
        </div>
    </div>

    <th:block th:if="${#lists.isEmpty(feedbacks)}">
        <div class="card">
            <div th:replace="~{fragments/ui :: emptyState(#{feedback.empty.title}, #{feedback.empty.text}, null, null)}"></div>
        </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(feedbacks)}">
        <div class="list-toolbar" role="search">
            <label class="search-input">
                <span class="visually-hidden" th:text="#{feedback.search}">ค้นหาฟีดแบ็ก</span>
                <i data-lucide="search"></i>
                <input class="form-control" type="search" th:placeholder="#{feedback.search.placeholder}" data-filter-target="#feedbackList" autocomplete="off">
            </label>
            <label class="visually-hidden" for="filterCategory" th:text="#{feedback.categoryLabel}">หมวด</label>
            <select class="form-select" id="filterCategory" data-filter-target="#feedbackList" data-filter-key="category">
                <option value="" th:text="#{feedback.allCategories}">ทุกหมวด</option>
                <option th:each="c, st : ${categories}" th:value="'c' + ${st.index}" th:text="#{${'feedback.category.' + st.index}}"></option>
            </select>
            <label class="visually-hidden" for="filterRead" th:text="#{feedback.readFilter}">การอ่าน</label>
            <select class="form-select" id="filterRead" data-filter-target="#feedbackList" data-filter-key="read">
                <option value="unread" th:selected="${unread > 0}" th:text="#{common.unread}">ยังไม่อ่าน</option>
                <option value="" th:selected="${unread == 0}" th:text="#{common.all}">ทั้งหมด</option>
                <option value="read" th:text="#{common.read}">อ่านแล้ว</option>
            </select>
            <span class="list-count" data-filter-count="#feedbackList" aria-live="polite"></span>
        </div>

        <div class="card" id="feedbackList">
            <ul class="list-plain list-roomy">
                <li th:each="f : ${feedbacks}" data-row
                    th:with="catIndex=${T(java.util.Arrays).asList(categories).indexOf(f.category)}"
                    th:attr="data-category='c' + ${catIndex},data-read=${f.readByOwner} ? 'read' : 'unread'">
                    <div class="min-w-0 flex-grow-1">
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                            <span class="score" th:classappend="${f.rating <= 2} ? 'is-low'" role="img" th:attr="aria-label=#{common.starsOf5(${f.rating})}"><span th:text="${f.rating}">4</span><small>/5</small></span>
                            <span class="badge status-neutral" th:text="${f.categoryKey != null} ? #{${f.categoryKey}} : ${f.category}"></span>
                            <span class="badge status-info" th:unless="${f.readByOwner}" th:text="#{feedback.new}">ใหม่</span>
                        </div>
                        <p class="mb-1" th:text="${f.message}"></p>
                        <div class="item-meta">
                            <span th:text="${f.author.fullName}"></span>
                            <span th:if="${f.room != null}" th:text="'· ' + #{common.roomN(${f.room.roomNumber})}"></span>
                            <span th:text="'· ' + ${#temporals.format(f.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                    </div>
                    <a class="btn btn-sm item-end" th:classappend="${f.readByOwner} ? 'btn-ghost' : 'btn-soft'"
                       th:href="@{/admin/feedback/{id}/read(id=${f.id})}"
                       th:attr="aria-label=(${f.readByOwner} ? #{feedback.markUnreadN(${f.author.fullName})} : #{feedback.markReadN(${f.author.fullName})})">
                        <i th:data-lucide="${f.readByOwner} ? 'mail' : 'check'"></i>
                        <span th:text="${f.readByOwner} ? #{feedback.markUnread} : #{feedback.markRead}"></span>
                    </a>
                </li>
            </ul>
            <div data-filter-empty="#feedbackList" hidden>
                <div th:replace="~{fragments/ui :: emptyState(#{feedback.noMatch.title}, #{feedback.noMatch.text}, null, null)}"></div>
            </div>
        </div>
    </th:block>
</main>
</body>
</html>
