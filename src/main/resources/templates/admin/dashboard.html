<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout(#{nav.dashboard}, 'dashboard', ~{::main})}">
<body>
<main th:with="today=${now.toLocalDate()}, DAYS=${T(java.time.temporal.ChronoUnit).DAYS}">
    <div class="page-header">
        <h1 class="page-title" th:text="#{nav.dashboard}">ภาพรวม</h1>
        <p class="page-sub mb-1" th:text="#{dash.asOf(${#temporals.format(now, 'dd/MM/yyyy HH:mm')})}"></p>
    </div>

    <!-- 1. money leads; free rooms, repairs and slips follow. A figure takes colour only when someone has to act -->
    <section class="ledger" th:aria-label="#{nav.dashboard}">
        <a class="ledger-cell is-lead" th:classappend="${unpaidTotal > 0} ? 'is-danger'" th:href="@{/admin/bills}">
            <span class="ledger-label" th:text="#{dash.unpaidTotal}">ยอดค้างชำระ</span>
            <span class="ledger-figure" th:text="'฿' + ${#numbers.formatDecimal(unpaidTotal, 1, 'COMMA', 0, 'POINT')}">฿0</span>
            <span class="ledger-note" th:text="#{dash.unpaidBills(${#lists.size(unpaidBills)})}"></span>
        </a>
        <a class="ledger-cell" th:href="@{/admin/layout}">
            <span class="ledger-label" th:text="#{dash.freeRooms}">ห้องว่าง</span>
            <span class="ledger-figure"><span th:text="${availableCount}">0</span> <small th:text="'/ ' + ${roomCount}"></small></span>
            <span class="ledger-note" th:text="#{dash.tenants(${tenantCount})}"></span>
        </a>
        <a class="ledger-cell" th:classappend="${openRepairCount > 0} ? 'is-warning'" th:href="@{/admin/repairs}">
            <span class="ledger-label" th:text="#{dash.openRepairs}">งานซ่อมที่รอ</span>
            <span class="ledger-figure" th:text="${openRepairCount}">0</span>
            <span class="ledger-note" th:text="${openRepairCount > 0} ? #{dash.openRepairs.some} : #{dash.openRepairs.none}"></span>
        </a>
        <a class="ledger-cell" th:classappend="${slipsToReview > 0} ? 'is-warning'" th:href="@{/admin/payments}">
            <span class="ledger-label" th:text="#{dash.slips}">สลิปรอตรวจ</span>
            <span class="ledger-figure" th:text="${slipsToReview}">0</span>
            <span class="ledger-note" th:text="${slipsToReview > 0} ? #{dash.slips.some} : #{dash.slips.none}"></span>
        </a>
    </section>

    <div class="row gx-5 gy-5">
        <div class="col-lg-8 stack-sections">

            <!-- 2. unpaid bills, oldest first -->
            <section class="card" aria-labelledby="unpaidTitle">
                <div class="card-header">
                    <h2 class="h2 mb-0" id="unpaidTitle" th:text="#{dash.unpaidList}">บิลค้างชำระ</h2>
                    <a class="card-link" th:href="@{/admin/bills}" th:if="${!#lists.isEmpty(unpaidBills)}"
                       th:text="#{common.viewAllN(${#lists.size(unpaidBills)})}">ดูทั้งหมด</a>
                </div>
                <div class="table-wrap" th:unless="${#lists.isEmpty(unpaidBills)}">
                    <table class="table table-cards">
                        <thead><tr><th th:text="#{common.room}">ห้อง</th><th th:text="#{common.month}">เดือน</th><th th:text="#{bill.due}">ครบกำหนด</th><th class="text-end" th:text="#{dash.amountBaht}">ยอด (บาท)</th></tr></thead>
                        <tbody>
                        <tr th:each="b, st : ${unpaidBills}" th:if="${st.index < 6}">
                            <td class="td-title" th:text="${b.room.roomNumber}"></td>
                            <td class="num" th:text="${b.billMonth}"></td>
                            <td>
                                <span class="cell">
                                    <span class="num" th:text="${b.dueDate != null} ? ${#temporals.format(b.dueDate, 'dd/MM/yyyy')} : '-'"></span>
                                    <span th:if="${b.dueDate != null and b.dueDate.isBefore(today)}" class="badge status-danger ms-1"
                                          th:text="#{common.daysLate(${DAYS.between(b.dueDate, today)})}"></span>
                                </span>
                            </td>
                            <td class="text-end num fw-medium" th:text="${#numbers.formatDecimal(b.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <th:block th:if="${#lists.isEmpty(unpaidBills)}">
                    <div th:replace="~{fragments/ui :: emptyState(#{dash.noUnpaid.title}, #{dash.noUnpaid.text}, null, null)}"></div>
                </th:block>
            </section>

            <!-- 3. what tenants say -->
            <section class="card" aria-labelledby="feedbackTitle">
                <div class="card-header">
                    <h2 class="h2 mb-0" id="feedbackTitle" th:text="#{dash.latestFeedback}">ฟีดแบ็กล่าสุด</h2>
                    <span class="badge status-danger" th:if="${unreadFeedback > 0}" th:text="#{dash.unreadN(${unreadFeedback})}"></span>
                    <a class="card-link" th:href="@{/admin/feedback}" th:text="#{common.viewAll}">ดูทั้งหมด</a>
                </div>
                <div class="lead-score" th:unless="${#lists.isEmpty(latestFeedback)}">
                    <span class="kpi-value" th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">0</span>
                    <span class="text-muted small" th:text="#{dash.avgRating}">คะแนนเฉลี่ยจาก 5</span>
                </div>
                <ul class="list-plain" th:unless="${#lists.isEmpty(latestFeedback)}">
                    <li th:each="f : ${latestFeedback}" class="align-items-start">
                        <div class="min-w-0">
                            <div class="item-title">
                                <span th:text="${f.author.fullName}"></span>
                                <span class="item-meta" th:if="${f.room != null}" th:text="'· ' + #{common.roomN(${f.room.roomNumber})}"></span>
                                <span class="dot info ms-1" th:unless="${f.readByOwner}" th:title="#{common.unread}"></span>
                            </div>
                            <div class="item-meta clamp-2">
                                <span class="badge status-neutral me-2" th:text="${f.categoryKey != null} ? #{${f.categoryKey}} : ${f.category}"></span><span th:text="${f.message}"></span>
                            </div>
                        </div>
                        <span class="score item-end" th:classappend="${f.rating <= 2} ? 'is-low'" role="img" th:attr="aria-label=#{common.starsOf5(${f.rating})}"><span th:text="${f.rating}">4</span><small>/5</small></span>
                    </li>
                </ul>
                <th:block th:if="${#lists.isEmpty(latestFeedback)}">
                    <div th:replace="~{fragments/ui :: emptyState(#{feedback.empty.title}, #{dash.noFeedback.text}, null, null)}"></div>
                </th:block>
            </section>
        </div>

        <div class="col-lg-4 stack-sections">

            <!-- 4. rooms using unusually much electricity -->
            <section class="card" aria-labelledby="abnormalTitle">
                <div class="card-header">
                    <h2 class="h2 mb-0" id="abnormalTitle" th:text="#{notice.abnormal.title}">ค่าไฟสูงผิดปกติ</h2>
                    <a class="card-link" th:href="@{/admin/analytics}" th:text="#{dash.viewCharts}">ดูกราฟ</a>
                </div>
                <ul class="list-plain" th:unless="${#lists.isEmpty(abnormal)}">
                    <li th:each="a : ${abnormal}">
                        <div>
                            <div class="item-title num" th:text="${a.room.roomNumber}"></div>
                            <div class="item-meta" th:text="${a.billMonth} + ' · ' + #{common.unitsN(${a.units})}"></div>
                        </div>
                        <span class="badge status-danger item-end num" th:text="'+' + ${a.percentAbove} + '%'"></span>
                    </li>
                </ul>
                <p class="text-muted small mb-0" th:if="${#lists.isEmpty(abnormal)}" th:text="#{dash.noAbnormal}">ไม่มีห้องที่ใช้ไฟสูงกว่าปกติ</p>
            </section>

            <!-- 5. shared laundry room (simulated) -->
            <section class="card" aria-labelledby="laundryTitle"
                     th:with="freeMachines=${#lists.size(machines.?[isAvailableAt(#vars.now)])}">
                <div class="card-header">
                    <h2 class="h2 mb-0" id="laundryTitle" th:text="#{laundry.title}">ห้องซักผ้า</h2>
                    <span class="badge status-neutral" th:text="#{common.simulated}">จำลอง</span>
                    <span class="card-link text-muted fw-normal" th:text="#{common.freeOf(${freeMachines}, ${#lists.size(machines)})}"></span>
                </div>
                <ul class="list-plain">
                    <li th:each="m : ${machines}">
                        <span th:text="${m.name}"></span>
                        <span th:if="${m.isAvailableAt(now)}" class="badge status-success" th:text="#{common.free}">ว่าง</span>
                        <span th:unless="${m.isAvailableAt(now)}" class="badge status-warning" th:text="#{common.minutesLeft(${m.minutesLeftAt(now)})}"></span>
                    </li>
                </ul>
            </section>
        </div>
    </div>
</main>
</body>
</html>
