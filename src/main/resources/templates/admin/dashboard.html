<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout(#{nav.dashboard}, 'dashboard', ~{::main})}">
<body>
<main th:with="today=${now.toLocalDate()}, DAYS=${T(java.time.temporal.ChronoUnit).DAYS}">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="#{nav.dashboard}">ภาพรวม</h1>
            <p class="page-sub" th:text="#{dash.asOf(${#temporals.format(now, 'dd/MM/yyyy HH:mm')})}"></p>
        </div>
    </div>

    <!-- 1. what needs attention: money, free rooms, repairs, slips -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-xl-3">
            <a class="card kpi tone-danger" th:classappend="${unpaidTotal > 0} ? 'is-alert'" th:href="@{/admin/bills}">
                <span class="kpi-head"><span th:text="#{dash.unpaidTotal}">ยอดค้างชำระ</span> <i data-lucide="receipt"></i></span>
                <span class="kpi-value" th:text="'฿' + ${#numbers.formatDecimal(unpaidTotal, 1, 'COMMA', 0, 'POINT')}">฿0</span>
                <span class="kpi-meta" th:text="#{dash.unpaidBills(${#lists.size(unpaidBills)})}"></span>
            </a>
        </div>
        <div class="col-6 col-xl-3">
            <a class="card kpi tone-success" th:href="@{/admin/layout}">
                <span class="kpi-head"><span th:text="#{dash.freeRooms}">ห้องว่าง</span> <i data-lucide="door-open"></i></span>
                <span class="kpi-value"><span th:text="${availableCount}">0</span> <small th:text="'/ ' + ${roomCount}"></small></span>
                <span class="kpi-meta" th:text="#{dash.tenants(${tenantCount})}"></span>
            </a>
        </div>
        <div class="col-6 col-xl-3">
            <a class="card kpi tone-warning" th:classappend="${openRepairCount > 0} ? 'is-alert'" th:href="@{/admin/repairs}">
                <span class="kpi-head"><span th:text="#{dash.openRepairs}">งานซ่อมที่รอ</span> <i data-lucide="wrench"></i></span>
                <span class="kpi-value" th:text="${openRepairCount}">0</span>
                <span class="kpi-meta" th:text="${openRepairCount > 0} ? #{dash.openRepairs.some} : #{dash.openRepairs.none}"></span>
            </a>
        </div>
        <div class="col-6 col-xl-3">
            <a class="card kpi tone-info" th:classappend="${slipsToReview > 0} ? 'is-alert'" th:href="@{/admin/payments}">
                <span class="kpi-head"><span th:text="#{dash.slips}">สลิปรอตรวจ</span> <i data-lucide="scan-line"></i></span>
                <span class="kpi-value" th:text="${slipsToReview}">0</span>
                <span class="kpi-meta" th:text="${slipsToReview > 0} ? #{dash.slips.some} : #{dash.slips.none}"></span>
            </a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-8 d-flex flex-column gap-3">

            <!-- 2. unpaid bills, oldest first -->
            <section class="card" aria-labelledby="unpaidTitle">
                <div class="card-header">
                    <h2 class="h2 mb-0" id="unpaidTitle" th:text="#{dash.unpaidList}">บิลค้างชำระ</h2>
                    <a class="card-link" th:href="@{/admin/bills}" th:if="${!#lists.isEmpty(unpaidBills)}"
                       th:text="#{common.viewAllN(${#lists.size(unpaidBills)})}">ดูทั้งหมด</a>
                </div>
                <div class="table-wrap" th:unless="${#lists.isEmpty(unpaidBills)}">
                    <table class="table table-cards">
                        <thead><tr><th th:text="#{common.room}">ห้อง</th><th th:text="#{common.month}">เดือน</th><th th:text="#{bill.due}">ครบกำหนด</th><th class="text-end" th:text="#{dash.amountBaht}">ยอด (บาท)</th></tr></thead>
                        <tbody>
                        <tr th:each="b, st : ${unpaidBills}" th:if="${st.index < 6}">
                            <td class="td-title" th:text="${b.room.roomNumber}"></td>
                            <td class="num" th:text="${b.billMonth}"></td>
                            <td>
                                <span class="cell">
                                    <span class="num" th:text="${b.dueDate != null} ? ${#temporals.format(b.dueDate, 'dd/MM/yyyy')} : '-'"></span>
                                    <span th:if="${b.dueDate != null and b.dueDate.isBefore(today)}" class="status status-danger ms-1"
                                          th:text="#{common.daysLate(${DAYS.between(b.dueDate, today)})}"></span>
                                </span>
                            </td>
                            <td class="text-end num fw-medium" th:text="${#numbers.formatDecimal(b.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <th:block th:if="${#lists.isEmpty(unpaidBills)}">
                    <div th:replace="~{fragments/ui :: emptyState('circle-check', #{dash.noUnpaid.title}, #{dash.noUnpaid.text}, null, null)}"></div>
                </th:block>
            </section>

            <!-- 3. what tenants say -->
            <section class="card" aria-labelledby="feedbackTitle">
                <div class="card-header">
                    <h2 class="h2 mb-0" id="feedbackTitle" th:text="#{dash.latestFeedback}">ฟีดแบ็กล่าสุด</h2>
                    <th:block th:if="${unreadFeedback > 0}"><span th:replace="~{fragments/ui :: status('info', #{dash.unreadN(${unreadFeedback})})}"></span></th:block>
                    <a class="card-link" th:href="@{/admin/feedback}" th:text="#{common.viewAll}">ดูทั้งหมด</a>
                </div>
                <div class="px-4 pt-3 d-flex align-items-baseline gap-2" th:unless="${#lists.isEmpty(latestFeedback)}">
                    <span class="kpi-value" th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">0</span>
                    <span class="text-muted small" th:text="#{dash.avgRating}">คะแนนเฉลี่ยจาก 5</span>
                </div>
                <ul class="list-plain" th:unless="${#lists.isEmpty(latestFeedback)}">
                    <li th:each="f : ${latestFeedback}" class="align-items-start">
                        <div class="min-w-0">
                            <div class="item-title">
                                <span th:text="${f.author.fullName}"></span>
                                <span class="item-meta" th:if="${f.room != null}" th:text="'· ' + #{common.roomN(${f.room.roomNumber})}"></span>
                                <span class="dot info ms-1" th:unless="${f.readByOwner}" th:title="#{common.unread}"></span>
                            </div>
                            <div class="item-meta clamp-2">
                                <span class="tag me-1" th:text="${f.categoryKey != null} ? #{${f.categoryKey}} : ${f.category}"></span><span th:text="${f.message}"></span>
                            </div>
                        </div>
                        <span class="rating item-end text-nowrap" role="img" th:attr="aria-label=#{common.starsOf5(${f.rating})}">
                            <i th:each="s : ${#numbers.sequence(1, 5)}" data-lucide="star" th:class="${s <= f.rating} ? 'star-on' : 'star-off'"></i>
                        </span>
                    </li>
                </ul>
                <th:block th:if="${#lists.isEmpty(latestFeedback)}">
                    <div th:replace="~{fragments/ui :: emptyState('message-square', #{feedback.empty.title}, #{dash.noFeedback.text}, null, null)}"></div>
                </th:block>
            </section>
        </div>

        <div class="col-lg-4 d-flex flex-column gap-3">

            <!-- 4. rooms using unusually much electricity -->
            <section class="card" aria-labelledby="abnormalTitle">
                <div class="card-header">
                    <h2 class="h2 mb-0" id="abnormalTitle" th:text="#{notice.abnormal.title}">ค่าไฟสูงผิดปกติ</h2>
                    <a class="card-link" th:href="@{/admin/analytics}" th:text="#{dash.viewCharts}">ดูกราฟ</a>
                </div>
                <ul class="list-plain" th:unless="${#lists.isEmpty(abnormal)}">
                    <li th:each="a : ${abnormal}">
                        <div>
                            <div class="item-title" th:text="#{common.roomN(${a.room.roomNumber})}"></div>
                            <div class="item-meta" th:text="${a.billMonth} + ' · ' + #{common.unitsN(${a.units})}"></div>
                        </div>
                        <span class="delta-up item-end" th:text="'+' + ${a.percentAbove} + '%'"></span>
                    </li>
                </ul>
                <p class="text-muted small px-4 py-3 mb-0" th:if="${#lists.isEmpty(abnormal)}" th:text="#{dash.noAbnormal}">ไม่มีห้องที่ใช้ไฟสูงกว่าปกติ</p>
            </section>

            <!-- 5. shared laundry room (simulated) -->
            <section class="card" aria-labelledby="laundryTitle"
                     th:with="freeMachines=${#lists.size(machines.?[isAvailableAt(#vars.now)])}">
                <div class="card-header">
                    <h2 class="h2 mb-0" id="laundryTitle" th:text="#{laundry.title}">ห้องซักผ้า</h2>
                    <span class="tag" th:text="#{common.simulated}">จำลอง</span>
                    <span class="card-link text-muted" th:text="#{common.freeOf(${freeMachines}, ${#lists.size(machines)})}"></span>
                </div>
                <ul class="list-plain">
                    <li th:each="m : ${machines}">
                        <span th:text="${m.name}"></span>
                        <th:block th:if="${m.isAvailableAt(now)}"><span th:replace="~{fragments/ui :: status('success', #{common.free})}"></span></th:block>
                        <th:block th:unless="${m.isAvailableAt(now)}"><span th:replace="~{fragments/ui :: status('warning', #{common.minutesLeft(${m.minutesLeftAt(now)})})}"></span></th:block>
                    </li>
                </ul>
            </section>
        </div>
    </div>
</main>
</body>
</html>
