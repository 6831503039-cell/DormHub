<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout(#{repair.form.title}, 'repairs', ~{::main})}">
<body>
<main class="form-page">
    <a class="back-link" th:href="@{/admin/repairs}"><i data-lucide="chevron-left"></i> <span th:text="#{nav.repairs}">แจ้งซ่อม</span></a>
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${repair.id == null} ? #{repair.new} : ${repair.title}">แจ้งซ่อม</h1>
            <p class="page-sub" th:if="${repair.id != null}"
               th:text="#{common.roomN(${repair.room.roomNumber})} + (${repair.reportedBy != null} ? ' · ' + #{repair.reportedBy(${repair.reportedBy})} : '')"></p>
        </div>
    </div>

    <form class="card card-body" th:action="@{/admin/repairs}" th:object="${repair}" method="post">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{reportedBy}">

        <!-- when editing, the status is what changes most often, so it comes first -->
        <div class="form-section" th:if="${repair.id != null}">
            <h2 class="form-section-title" th:text="#{repair.jobStatus}">สถานะงาน</h2>
            <div class="row g-3">
                <div class="col-sm-6">
                    <label class="form-label" for="status" th:text="#{common.status}">สถานะ</label>
                    <select class="form-select" th:field="*{status}">
                        <option th:each="s : ${T(th.mfu.domain.RepairStatus).values()}" th:value="${s}" th:text="#{${s.key}}"></option>
                    </select>
                    <div class="form-text" th:text="#{repair.status.help}">ผู้เช่าจะเห็นสถานะนี้ในแอป</div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="adminNote"><span th:text="#{repair.adminNote}">รายละเอียดการดำเนินงาน</span> <span class="optional" th:text="#{common.optional}">(ไม่บังคับ)</span></label>
                    <textarea class="form-control" rows="3" th:field="*{adminNote}" maxlength="1000" th:placeholder="#{repair.adminNote.placeholder}"></textarea>
                    <div class="form-text" th:text="#{repair.adminNote.help}">ผู้เช่าห้องนี้จะเห็นข้อความนี้ใต้รายการแจ้งซ่อม</div>
                </div>
            </div>
        </div>

        <!-- updating: what the tenant reported is shown but cannot be changed (RepairController keeps it) -->
        <div class="form-section" th:if="${repair.id != null}">
            <h2 class="form-section-title" th:text="#{repair.jobDetails}">รายละเอียดงาน</h2>
            <dl class="detail-list mb-0">
                <div><dt th:text="#{common.room}">ห้อง</dt><dd th:text="${repair.room.roomNumber}"></dd></div>
                <div><dt th:text="#{repair.reportedDate}">วันที่แจ้ง</dt><dd class="num" th:text="${repair.reportedDate != null} ? ${#temporals.format(repair.reportedDate, 'dd/MM/yyyy')} : '-'"></dd></div>
                <div><dt th:text="#{repair.subject}">เรื่อง</dt><dd th:text="${repair.title}"></dd></div>
                <div><dt th:text="#{repair.details}">รายละเอียด</dt><dd class="pre-line" th:text="${repair.description != null and !#strings.isEmpty(repair.description)} ? ${repair.description} : '-'"></dd></div>
            </dl>
            <p class="form-text mb-0 mt-2" th:text="#{repair.details.locked}">ข้อมูลที่แจ้งมาแก้ไขไม่ได้ เปลี่ยนได้เฉพาะสถานะและรายละเอียดการดำเนินงาน</p>
        </div>

        <div class="form-section" th:if="${repair.id == null}">
            <h2 class="form-section-title" th:text="#{repair.jobDetails}">รายละเอียดงาน</h2>
            <div class="row g-3">
                <div class="col-sm-6">
                    <label class="form-label" for="room" th:text="#{common.room}">ห้อง</label>
                    <select class="form-select" id="room" name="room" required data-room-picker>
                        <option value="" th:text="#{bill.chooseRoom}">เลือกห้อง</option>
                        <option th:each="r : ${rooms}" th:value="${r.id}" th:attr="data-building=${r.building},data-floor=${r.floor}" th:text="${r.roomNumber}"
                                th:selected="${repair.room != null and repair.room.id == r.id}"></option>
                    </select>
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="reportedDate" th:text="#{repair.reportedDate}">วันที่แจ้ง</label>
                    <input class="form-control" type="date" th:field="*{reportedDate}" required>
                </div>
                <div class="col-12">
                    <label class="form-label" for="title" th:text="#{repair.subject}">เรื่อง</label>
                    <input class="form-control" th:field="*{title}" th:placeholder="#{repair.subject.placeholder}" required>
                </div>
                <div class="col-12">
                    <label class="form-label" for="description"><span th:text="#{repair.details}">รายละเอียด</span> <span class="optional" th:text="#{common.optional}">(ไม่บังคับ)</span></label>
                    <textarea class="form-control" rows="3" th:field="*{description}" maxlength="1000"></textarea>
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="status" th:text="#{common.status}">สถานะ</label>
                    <select class="form-select" th:field="*{status}">
                        <option th:each="s : ${T(th.mfu.domain.RepairStatus).values()}" th:value="${s}" th:text="#{${s.key}}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary" type="submit"><i data-lucide="check"></i> <span th:text="#{common.save}">บันทึก</span></button>
            <a class="btn btn-secondary" th:href="@{/admin/repairs}" th:text="#{common.cancel}">ยกเลิก</a>
        </div>
    </form>
</main>
</body>
</html>
