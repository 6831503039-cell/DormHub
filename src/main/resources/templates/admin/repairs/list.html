<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin :: layout('แจ้งซ่อม', 'repairs', ~{::main})}">
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="page-title mb-0">แจ้งซ่อม</h1>
        <a class="btn btn-primary" th:href="@{/admin/repairs/new}"><i data-lucide="plus"></i> เพิ่มรายการ</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>วันที่แจ้ง</th><th>ห้อง</th><th>เรื่อง</th><th>รายละเอียด</th><th>ผู้แจ้ง</th><th>สถานะ</th><th></th></tr></thead>
                <tbody>
                <tr th:each="r : ${repairs}">
                    <td class="text-nowrap" th:text="${r.reportedDate != null} ? ${#temporals.format(r.reportedDate, 'dd/MM/yyyy')} : '-'"></td>
                    <td class="fw-medium" th:text="${r.room.roomNumber}"></td>
                    <td th:text="${r.title}"></td>
                    <td class="text-muted" th:text="${r.description}"></td>
                    <td th:text="${r.reportedBy != null} ? ${r.reportedBy} : 'แอดมิน'"></td>
                    <td><span th:class="'badge soft-' + ${r.status.badge}" th:text="${r.status.label}"></span></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-light btn-icon" th:href="@{/admin/repairs/{id}(id=${r.id})}" title="แก้ไข"><i data-lucide="pencil"></i></a>
                        <a class="btn btn-light btn-icon text-danger" th:href="@{/admin/repairs/{id}/delete(id=${r.id})}" title="ลบ"
                           onclick="return confirm('ยืนยันการลบรายการนี้?')"><i data-lucide="trash-2"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(repairs)}"><td colspan="7" class="text-center text-muted py-4">ยังไม่มีรายการแจ้งซ่อม</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
