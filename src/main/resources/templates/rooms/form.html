<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('ข้อมูลห้อง')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('rooms')}"></nav>
<main class="container pb-5" style="max-width: 720px">
    <div th:replace="~{fragments :: flash}"></div>
    <h2 class="mb-3" th:text="${room.id == null} ? 'เพิ่มห้อง' : 'แก้ไขห้อง ' + ${room.roomNumber}">เพิ่มห้อง</h2>

    <form class="card card-body shadow-sm" th:action="@{/rooms}" th:object="${room}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="roomNumber">เลขห้อง</label>
                <input class="form-control" th:field="*{roomNumber}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="floor">ชั้น</label>
                <input class="form-control" type="number" min="1" th:field="*{floor}">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="roomType">ประเภทห้อง</label>
                <select class="form-select" th:field="*{roomType}">
                    <option value="แอร์">แอร์</option>
                    <option value="พัดลม">พัดลม</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="monthlyRent">ค่าเช่า/เดือน (บาท)</label>
                <input class="form-control" type="number" min="0" step="0.01" th:field="*{monthlyRent}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="status">สถานะ</label>
                <select class="form-select" th:field="*{status}">
                    <option th:each="s : ${T(th.mfu.domain.RoomStatus).values()}" th:value="${s}" th:text="${s.label}"></option>
                </select>
            </div>
        </div>
        <div class="mt-4">
            <button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> บันทึก</button>
            <a class="btn btn-outline-secondary" th:href="@{/rooms}">ยกเลิก</a>
        </div>
    </form>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
