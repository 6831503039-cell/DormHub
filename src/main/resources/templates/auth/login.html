<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{common.login} + ' · ' + ${dormName}">เข้าสู่ระบบ</title>
    <script th:src="@{/js/prefs.js}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/logo-icon.png}">
</head>
<body>
<button class="btn btn-ghost btn-icon page-settings" type="button" data-bs-toggle="modal" data-bs-target="#settingsModal"
        th:aria-label="#{settings.title}" th:title="#{settings.title}"><i data-lucide="settings"></i></button>
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="text-center mb-4">
            <img th:src="@{/img/logo.png}" alt="DormHub" class="d-block mx-auto" style="width:150px;height:150px;border-radius:16px">
            <h1 class="visually-hidden" th:text="${dormName}">DormHub</h1>
        </div>

        <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">อีเมลหรือรหัสผ่านไม่ถูกต้อง</div>
        <div th:if="${param.logout}" class="alert alert-info" th:text="#{login.loggedOut}">ออกจากระบบแล้ว</div>
        <div th:if="${param.expired}" class="alert alert-warning" th:text="#{login.expired}">เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง</div>
        <div th:if="${param.registered}" class="alert alert-success" th:text="#{login.registered}">สมัครสมาชิกสำเร็จ เข้าสู่ระบบได้เลย</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="email" th:text="#{common.email}">อีเมล</label>
                <input class="form-control" type="email" id="email" name="email" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password" th:text="#{common.password}">รหัสผ่าน</label>
                <div class="password-field">
                    <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
                    <button class="password-eye" type="button" data-toggle-password="password" th:aria-label="#{common.showPassword}" aria-pressed="false">
                        <span class="when-hidden"><i data-lucide="eye"></i></span><span class="when-shown" hidden><i data-lucide="eye-off"></i></span>
                    </button>
                </div>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit" th:text="#{common.login}">เข้าสู่ระบบ</button>
        </form>
        <div class="text-center mt-4 text-muted">
            <span th:text="#{login.noAccount}">ยังไม่มีบัญชี?</span> <a th:href="@{/register}" th:text="#{common.register}">สมัครสมาชิก</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/ui :: settingsModal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script th:src="@{/js/ui.js}"></script>
<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
