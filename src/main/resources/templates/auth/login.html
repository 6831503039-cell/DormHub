<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'เข้าสู่ระบบ · ' + ${dormName}">เข้าสู่ระบบ</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/logo-icon.png}">
</head>
<body>
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="text-center mb-4">
            <img th:src="@{/img/logo.png}" alt="DormHub" class="d-block mx-auto mb-2" style="width:150px;height:150px;border-radius:16px">
            <h1 class="visually-hidden" th:text="${dormName}">DormHub</h1>
            <div class="text-muted">เข้าสู่ระบบสำหรับผู้เช่าและเจ้าของหอพัก</div>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">อีเมลหรือรหัสผ่านไม่ถูกต้อง</div>
        <div th:if="${param.logout}" class="alert alert-info">ออกจากระบบแล้ว</div>
        <div th:if="${param.registered}" class="alert alert-success">สมัครสมาชิกสำเร็จ เข้าสู่ระบบได้เลย</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="email">อีเมล</label>
                <input class="form-control" type="email" id="email" name="email" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">รหัสผ่าน</label>
                <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">เข้าสู่ระบบ</button>
        </form>
        <div class="text-center mt-4 text-muted">
            ยังไม่มีบัญชี? <a th:href="@{/register}">สมัครสมาชิก</a>
        </div>
    </div>
</div>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
