<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{common.register} + ' · ' + ${dormName}">สมัครสมาชิก</title>
    <script th:src="@{/js/prefs.js}"></script>
    <th:block th:replace="~{fragments/fonts :: fonts}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/logo-icon.png}">
</head>
<body>
<button class="btn btn-ghost btn-icon page-settings" type="button" data-bs-toggle="modal" data-bs-target="#settingsModal"
        th:aria-label="#{settings.title}" th:title="#{settings.title}"><i data-lucide="settings"></i></button>
<div class="auth-split">
    <aside th:replace="~{fragments/ui :: authArt}"></aside>
    <main class="auth-main">
    <div class="auth-form">
        <div class="auth-head">
            <svg th:replace="~{fragments/ui :: sjdDrawing('auth-mini d-lg-none', null)}"></svg>
            <div class="auth-brand"><img th:src="@{/img/logo-icon.png}" alt="" class="brand-logo"> <span th:text="${dormName}">DormHub</span></div>
            <h1 class="auth-title" th:text="#{common.register}">สมัครสมาชิก</h1>
            <p class="auth-sub" th:text="#{register.hint}">ใช้อีเมลเดียวกับที่แจ้งไว้กับหอพัก ระบบจะเชื่อมบัญชีกับห้องของคุณให้อัตโนมัติ</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${form}" method="post">
            <div class="mb-3">
                <label class="form-label" for="fullName" th:text="#{common.fullName}">ชื่อ-นามสกุล</label>
                <input class="form-control" th:field="*{fullName}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email" th:text="#{common.email}">อีเมล</label>
                <input class="form-control" type="email" th:field="*{email}" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password" th:text="#{register.password}">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
                <div class="password-field">
                    <input class="form-control" type="password" th:field="*{password}" minlength="6" autocomplete="new-password" required>
                    <button class="password-eye" type="button" data-toggle-password="password" th:aria-label="#{common.showPassword}" aria-pressed="false">
                        <span class="when-hidden"><i data-lucide="eye"></i></span><span class="when-shown" hidden><i data-lucide="eye-off"></i></span>
                    </button>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="confirmPassword" th:text="#{register.confirmPassword}">ยืนยันรหัสผ่าน</label>
                <div class="password-field">
                    <input class="form-control" type="password" th:field="*{confirmPassword}" minlength="6" autocomplete="new-password" required>
                    <button class="password-eye" type="button" data-toggle-password="confirmPassword" th:aria-label="#{common.showPassword}" aria-pressed="false">
                        <span class="when-hidden"><i data-lucide="eye"></i></span><span class="when-shown" hidden><i data-lucide="eye-off"></i></span>
                    </button>
                </div>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit" th:text="#{common.register}">สมัครสมาชิก</button>
        </form>
        <p class="auth-alt">
            <span th:text="#{register.haveAccount}">มีบัญชีแล้ว?</span> <a th:href="@{/login}" th:text="#{common.login}">เข้าสู่ระบบ</a>
        </p>
    </div>
    </main>
</div>
<div th:replace="~{fragments/ui :: settingsModal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script th:src="@{/js/ui.js}"></script>
<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
