<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | DormHub'">DormHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f4f6fb; }
        .stat-card .bi { font-size: 2rem; opacity: .8; }
        .table td, .table th { vertical-align: middle; }
    </style>
</head>
<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}"><i class="bi bi-buildings"></i> DormHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'home'} ? 'active'" th:href="@{/}"><i class="bi bi-speedometer2"></i> ภาพรวม</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'rooms'} ? 'active'" th:href="@{/rooms}"><i class="bi bi-door-closed"></i> ห้องพัก</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'tenants'} ? 'active'" th:href="@{/tenants}"><i class="bi bi-people"></i> ผู้เช่า</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'bills'} ? 'active'" th:href="@{/bills}"><i class="bi bi-receipt"></i> บิลค่าเช่า</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'repairs'} ? 'active'" th:href="@{/repairs}"><i class="bi bi-tools"></i> แจ้งซ่อม</a></li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="flash">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
