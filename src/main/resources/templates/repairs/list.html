<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('แจ้งซ่อม')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('repairs')}"></nav>
<main class="container pb-5">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">แจ้งซ่อม</h2>
        <a class="btn btn-primary" th:href="@{/repairs/new}"><i class="bi bi-plus-lg"></i> แจ้งซ่อม</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>วันที่แจ้ง</th><th>ห้อง</th><th>เรื่อง</th><th>รายละเอียด</th><th>สถานะ</th><th></th></tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${repairs}">
                        <td class="text-nowrap" th:text="${r.reportedDate != null} ? ${#temporals.format(r.reportedDate, 'dd/MM/yyyy')} : '-'"></td>
                        <td class="fw-semibold" th:text="${r.room.roomNumber}"></td>
                        <td th:text="${r.title}"></td>
                        <td class="text-muted" th:text="${r.description}"></td>
                        <td><span th:class="'badge text-bg-' + ${r.status.badge}" th:text="${r.status.label}"></span></td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/repairs/{id}(id=${r.id})}"><i class="bi bi-pencil"></i> แก้ไข</a>
                            <a class="btn btn-sm btn-outline-danger" th:href="@{/repairs/{id}/delete(id=${r.id})}"
                               onclick="return confirm('ยืนยันการลบรายการนี้?')"><i class="bi bi-trash"></i> ลบ</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(repairs)}">
                        <td colspan="6" class="text-center text-muted py-4">ยังไม่มีรายการแจ้งซ่อม</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
