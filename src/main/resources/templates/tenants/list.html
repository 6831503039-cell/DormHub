<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('ผู้เช่า')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('tenants')}"></nav>
<main class="container pb-5">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">ผู้เช่า</h2>
        <a class="btn btn-primary" th:href="@{/tenants/new}"><i class="bi bi-person-plus"></i> เพิ่มผู้เช่า</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>ชื่อ-นามสกุล</th><th>ห้อง</th><th>โทรศัพท์</th><th>อีเมล</th><th>วันที่เข้าพัก</th><th></th></tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${tenants}">
                        <td class="fw-semibold" th:text="${t.fullName}"></td>
                        <td th:text="${t.room != null} ? ${t.room.roomNumber} : '-'"></td>
                        <td th:text="${t.phone}"></td>
                        <td th:text="${t.email}"></td>
                        <td th:text="${t.checkInDate != null} ? ${#temporals.format(t.checkInDate, 'dd/MM/yyyy')} : '-'"></td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/tenants/{id}(id=${t.id})}"><i class="bi bi-pencil"></i> แก้ไข</a>
                            <a class="btn btn-sm btn-outline-danger" th:href="@{/tenants/{id}/delete(id=${t.id})}"
                               onclick="return confirm('ยืนยันการลบผู้เช่านี้?')"><i class="bi bi-trash"></i> ลบ</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tenants)}">
                        <td colspan="6" class="text-center text-muted py-4">ยังไม่มีผู้เช่า</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
