<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('บิลค่าเช่า')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('bills')}"></nav>
<main class="container pb-5">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">บิลค่าเช่า</h2>
        <a class="btn btn-primary" th:href="@{/bills/new}"><i class="bi bi-plus-lg"></i> ออกบิล</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>เดือน</th><th>ห้อง</th>
                        <th class="text-end">ค่าเช่า</th><th class="text-end">ค่าน้ำ</th><th class="text-end">ค่าไฟ</th>
                        <th class="text-end">รวม (บาท)</th><th>สถานะ</th><th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${bills}">
                        <td th:text="${b.billMonth}"></td>
                        <td class="fw-semibold" th:text="${b.room.roomNumber}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(b.rent, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="text-end">
                            <span th:text="${#numbers.formatDecimal(b.waterCost, 1, 'COMMA', 2, 'POINT')}"></span>
                            <div class="small text-muted" th:text="${b.waterUnits} + ' หน่วย'"></div>
                        </td>
                        <td class="text-end">
                            <span th:text="${#numbers.formatDecimal(b.electricCost, 1, 'COMMA', 2, 'POINT')}"></span>
                            <div class="small text-muted" th:text="${b.electricUnits} + ' หน่วย'"></div>
                        </td>
                        <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(b.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <span th:if="${b.paid}" class="badge text-bg-success">ชำระแล้ว</span>
                            <span th:unless="${b.paid}" class="badge text-bg-danger">ค้างชำระ</span>
                        </td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm" th:classappend="${b.paid} ? 'btn-outline-secondary' : 'btn-outline-success'"
                               th:href="@{/bills/{id}/pay(id=${b.id})}" th:text="${b.paid} ? 'ยกเลิกชำระ' : 'รับชำระ'"></a>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/bills/{id}(id=${b.id})}"><i class="bi bi-pencil"></i></a>
                            <a class="btn btn-sm btn-outline-danger" th:href="@{/bills/{id}/delete(id=${b.id})}"
                               onclick="return confirm('ยืนยันการลบบิลนี้?')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(bills)}">
                        <td colspan="8" class="text-center text-muted py-4">ยังไม่มีบิล</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
