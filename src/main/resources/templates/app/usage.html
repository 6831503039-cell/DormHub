<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/app :: layout(#{usage.title}, 'home', ~{::main})}">
<body>
<main th:with="linked=${tenant != null and tenant.room != null}">
    <h1 class="app-title" th:text="#{usage.title}">การใช้ไฟฟ้า</h1>
    <p class="app-sub" th:text="${linked} ? #{usage.sub(${tenant.room.roomNumber})} : #{usage.sub.noRoom}">หน่วยไฟฟ้าย้อนหลัง 12 เดือนของห้อง</p>

    <div class="card" th:if="${#lists.isEmpty(bills)}">
        <div th:replace="~{fragments/ui :: emptyState('zap', #{usage.empty.title}, ${linked} ? #{usage.empty.text} : #{requests.notLinked}, null, null)}"></div>
    </div>

    <th:block th:unless="${#lists.isEmpty(bills)}">
        <div class="figure-row mb-5">
            <div class="figure">
                <span class="figure-label" th:text="#{home.lastElectric}">ไฟเดือนล่าสุด</span>
                <span class="figure-value"><span th:text="${bills[0].electricUnits}">0</span> <small th:text="#{common.units}">หน่วย</small></span>
                <span class="figure-meta num" th:text="${bills[0].billMonth} + ' · ฿' + ${#numbers.formatDecimal(bills[0].electricCost, 1, 'COMMA', 2, 'POINT')}"></span>
            </div>
            <div class="figure">
                <span class="figure-label" th:text="#{usage.average}">เฉลี่ยต่อเดือน</span>
                <span class="figure-value"><span th:text="${avgUnits}">0</span> <small th:text="#{common.units}">หน่วย</small></span>
                <span class="figure-meta" th:text="#{usage.monthsN(${#lists.size(bills)})}"></span>
            </div>
        </div>

        <section class="plain-section mb-4" aria-labelledby="usageListTitle">
            <div class="section-head"><h2 id="usageListTitle" th:text="#{usage.byMonth}">รายเดือน</h2></div>
            <ul class="list-plain usage-list">
                <li th:each="b : ${bills}">
                    <span class="num usage-month" th:text="${b.billMonth}"></span>
                    <span class="usage-bar" aria-hidden="true">
                        <span th:style="'width:' + (${maxUnits} > 0 ? ${b.electricUnits * 100 / maxUnits} : 0) + '%'"
                              th:classappend="${b.electricUnits > avgUnits * 1.3} ? 'is-high'"></span>
                    </span>
                    <span class="num usage-units" th:text="${b.electricUnits} + ' ' + #{common.units}"></span>
                </li>
            </ul>
            <p class="form-text mt-2 mb-0" th:text="#{usage.note}">ค่าไฟแสดงเป็นยอดรวมของทั้งห้อง ดูยอดที่ต้องชำระได้ที่เมนูบิล</p>
        </section>
    </th:block>
</main>
</body>
</html>
