<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/app :: layout(#{tab.home}, 'home', ~{::main})}">
<body>
<main th:with="linked=${tenant != null and tenant.room != null}">
    <!-- account not linked to a room yet -->
    <section class="mb-5" th:unless="${linked}">
        <h1 class="app-title" th:text="#{home.notLinked.title}">บัญชียังไม่ผูกกับห้องพัก</h1>
        <p class="text-muted small mb-0" th:utext="#{home.notLinked.text(${'<b>' + #strings.escapeXml(currentUser.email) + '</b>'})}"></p>
        <p class="small mb-0 mt-2" th:if="${latestBooking != null}">
            <span th:text="#{home.rentRequest(${latestBooking.room.roomNumber})}"></span>
            <span th:class="'badge soft-' + ${latestBooking.status.badge}" th:text="#{${latestBooking.status.key}}"></span>
        </p>
        <a class="btn btn-primary mt-3" th:href="@{/app/rent}" th:text="#{home.rentRoom}">เช่าห้องพัก</a>
    </section>

    <!-- 1. what I owe: the only filled block on the page, and only when there is something to pay -->
    <section class="hero" th:if="${linked}" th:classappend="${myOutstanding <= 0} ? 'is-clear'" th:aria-label="#{home.amountDue}">
        <div class="hero-room">
            <span class="hero-plate" th:text="${tenant.room.roomNumber}">A101</span>
            <span th:text="${residenceName} + (${tenant.room.roomType != null} ? ' · ' + ${tenant.room.roomType} : '')">SJD Mansion</span>
        </div>
        <div class="hero-label" th:text="${myOutstanding > 0} ? #{home.amountDueShare} : #{home.amountDue}"></div>
        <div class="amount" th:text="'฿' + ${#numbers.formatDecimal(myOutstanding, 1, 'COMMA', 2, 'POINT')}">฿0</div>
        <a class="btn" th:classappend="${myOutstanding > 0} ? 'btn-light' : 'btn-secondary'" th:href="@{/app/bills}"
           th:text="${myOutstanding > 0} ? #{home.pay} : #{home.viewBills}"></a>
    </section>

    <!-- 2. reminders -->
    <section class="notice-list" th:if="${notices != null and !#lists.isEmpty(notices)}" aria-labelledby="noticeTitle">
        <h2 class="visually-hidden" id="noticeTitle" th:text="#{home.notices}">การแจ้งเตือน</h2>
        <div th:each="n : ${notices}" class="notice" th:classappend="${n.level}" role="status">
            <div class="notice-title" th:text="#{${n.titleKey}}"></div>
            <div class="text-muted" th:text="${#messages.msgWithParams(n.messageKey, n.args)}"></div>
        </div>
    </section>

    <!-- 3. the building's services with where each one stands; only for accounts with a room (HasRoomInterceptor) -->
    <th:block th:if="${linked}">
    <nav class="directory rows" th:aria-label="#{home.shortcuts}">
        <a class="dir-row" th:href="@{/app/parcels}">
            <span th:text="#{nav.parcels}">พัสดุ</span>
            <span class="dir-value is-alert" th:if="${parcelsWaiting != null and parcelsWaiting > 0}" th:text="#{parcels.status.waiting} + ' ' + ${parcelsWaiting}"></span>
        </a>
        <a class="dir-row" th:href="@{/app/laundry}">
            <span th:text="#{tab.laundry}">ซักผ้า</span>
            <span class="dir-value" th:text="#{common.freeOf(${laundryAvailable}, ${laundryTotal})}"></span>
        </a>
        <a class="dir-row" th:href="@{/app/usage}" th:if="${latestBill != null}">
            <span th:text="#{usage.title}">การใช้ไฟฟ้า</span>
            <span class="dir-value" th:text="${latestBill.billMonth} + ' · ' + #{common.unitsN(${latestBill.electricUnits})}"></span>
        </a>
        <a class="dir-row" th:href="@{/app/requests}"><span th:text="#{nav.repairs}">แจ้งซ่อม</span></a>
    </nav>

    <!-- announcements from the office -->
    <section class="mb-5" th:unless="${#lists.isEmpty(announcements)}" aria-labelledby="newsTitle">
        <div class="d-flex justify-content-between align-items-baseline">
            <h2 class="section-title mt-0" id="newsTitle" th:text="#{nav.announcements}">ประกาศ</h2>
            <a class="small" th:href="@{/app/announcements}" th:text="#{common.viewAll}">ดูทั้งหมด</a>
        </div>
        <div class="rows">
            <a class="news-item" th:each="a : ${announcements}" th:href="@{'/app/announcements#a' + ${a.id}}">
                <span class="news-date" th:text="${#temporals.format(a.createdAt, 'dd/MM')}">08/11</span>
                <span class="min-w-0 flex-grow-1">
                    <span class="d-block fw-medium">
                        <i data-lucide="pin" class="pin" th:if="${a.pinned}"></i> <span th:text="${a.title}"></span>
                    </span>
                    <span class="d-block small text-muted clamp-2" th:if="${a.body != null}" th:text="${a.body}"></span>
                </span>
                <img th:if="${a.hasImage()}" class="news-thumb" th:src="@{/announcements/{id}/image(id=${a.id})}" alt="" loading="lazy">
            </a>
        </div>
    </section>
    </th:block>

    <!-- 4. roommates -->
    <section class="card mb-4" th:if="${roommates != null}" aria-labelledby="roommatesTitle">
        <div class="card-header">
            <h2 class="h2 mb-0" id="roommatesTitle" th:text="#{home.roommates}">เพื่อนร่วมห้อง</h2>
            <span class="card-link text-muted fw-normal" th:text="${#lists.size(roommates)} + '/' + #{common.peopleN(${tenant.room.capacity})}"></span>
        </div>
        <ul class="list-plain">
            <li th:each="m : ${roommates}">
                <span th:text="${m.fullName}"></span>
                <span class="badge status-info" th:if="${m.id == tenant.id}" th:text="#{home.you}">คุณ</span>
            </li>
        </ul>
        <p class="form-text mt-2 mb-0" th:text="#{home.splitNote}">ค่าห้อง ค่าน้ำ และค่าไฟ หารเท่ากันทุกคนในห้อง</p>
    </section>
</main>
</body>
</html>
