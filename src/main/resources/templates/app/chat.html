<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/app :: layout('ถาม AI', 'chat', ~{::main})}">
<body>
<main>
    <div class="d-flex align-items-center gap-2 mb-2">
        <span class="stat-icon accent" style="width:38px;height:38px"><i data-lucide="bot"></i></span>
        <div>
            <div class="fw-semibold">Smart Virtual Admin</div>
            <div class="small text-muted" th:text="${aiEnabled} ? 'ขับเคลื่อนด้วย Gemini AI' : 'โหมดคำตอบอัตโนมัติ (ยังไม่ได้ตั้งค่า Gemini API)'"></div>
        </div>
    </div>

    <div class="card mb-2">
        <div class="chat-box" id="chatBox">
            <div class="bubble bot">สวัสดีครับ ผมเป็นแอดมินเสมือนของหอพัก ถามได้เลย เช่น รหัส Wi-Fi, ยอดค่าห้อง, เครื่องซักผ้าว่างไหม หรือวิธีแจ้งซ่อม</div>
        </div>
    </div>

    <div class="chips mb-2">
        <button class="chip" type="button">ขอรหัส Wi-Fi</button>
        <button class="chip" type="button">ค่าห้องเดือนนี้เท่าไหร่</button>
        <button class="chip" type="button">เครื่องซักผ้าว่างไหม</button>
        <button class="chip" type="button">แจ้งซ่อมยังไง</button>
        <button class="chip" type="button">กฎหอพัก</button>
    </div>

    <form id="chatForm" class="d-flex gap-2 mb-4">
        <input class="form-control" id="chatInput" placeholder="พิมพ์คำถาม..." autocomplete="off" maxlength="1000">
        <button class="btn btn-primary px-3" type="submit" aria-label="ส่ง"><i data-lucide="send"></i></button>
    </form>

    <script>
        (function () {
            const box = document.getElementById('chatBox');
            const form = document.getElementById('chatForm');
            const input = document.getElementById('chatInput');
            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;
            const history = [];

            function add(text, who) {
                const div = document.createElement('div');
                div.className = 'bubble ' + who;
                div.textContent = text;
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;
                return div;
            }

            async function send(text) {
                if (!text.trim()) return;
                add(text, 'user');
                input.value = '';
                const typing = add('กำลังพิมพ์...', 'bot typing');
                try {
                    const res = await fetch('/app/chat/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', [header]: token },
                        body: JSON.stringify({ message: text, history: history })
                    });
                    const data = await res.json();
                    typing.remove();
                    add(data.reply, 'bot');
                    history.push({ role: 'user', text: text }, { role: 'bot', text: data.reply });
                } catch (e) {
                    typing.remove();
                    add('ขออภัย เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง', 'bot');
                }
            }

            form.addEventListener('submit', e => { e.preventDefault(); send(input.value); });
            document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => send(c.textContent)));
        })();
    </script>
</main>
</body>
</html>
