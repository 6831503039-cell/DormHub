<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/app :: layout(#{tab.chat}, 'chat', ~{::main})}">
<body>
<main>
    <h1 class="visually-hidden" th:text="#{chat.title}">แอดมินเสมือน</h1>

    <div class="card mb-3">
        <div class="chat-box" id="chatBox" role="log" aria-live="polite" th:aria-label="#{chat.log}">
            <div class="bubble bot" th:text="#{chat.welcome}">สวัสดีครับ ถามได้เลย เช่น รหัส Wi-Fi ยอดค่าห้อง เครื่องซักผ้าว่างไหม หรือวิธีแจ้งซ่อม</div>
        </div>
    </div>

    <div class="chips mb-3" th:aria-label="#{chat.faq}">
        <button class="chip" type="button" th:text="#{chat.chip.wifi}">ขอรหัส Wi-Fi</button>
        <button class="chip" type="button" th:text="#{chat.chip.bill}">ค่าห้องเดือนนี้เท่าไหร่</button>
        <button class="chip" type="button" th:text="#{chat.chip.laundry}">เครื่องซักผ้าว่างไหม</button>
        <button class="chip" type="button" th:text="#{chat.chip.repair}">แจ้งซ่อมยังไง</button>
        <button class="chip" type="button" th:text="#{chat.chip.rules}">กฎหอพัก</button>
    </div>

    <form id="chatForm" class="d-flex gap-2 mb-4" data-no-loading>
        <label class="visually-hidden" for="chatInput" th:text="#{chat.input}">พิมพ์คำถาม</label>
        <input class="form-control" id="chatInput" th:placeholder="#{chat.input}" autocomplete="off" maxlength="1000" enterkeyhint="send">
        <button class="btn btn-primary btn-icon" id="chatSend" type="submit" th:aria-label="#{chat.send}"><i data-lucide="send"></i></button>
    </form>

    <!-- jQuery for the AJAX call to the chat web service (POST /app/chat/send), as in the FullStack lab -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
        $(document).ready(function () {
            var token = $('meta[name="_csrf"]').attr('content');
            var header = $('meta[name="_csrf_header"]').attr('content');
            var history = [];

            // add one chat bubble to the box and scroll down
            function add(text, who) {
                var bubble = $('<div></div>').addClass('bubble ' + who).text(text);
                $('#chatBox').append(bubble);
                $('#chatBox').scrollTop($('#chatBox')[0].scrollHeight);
                return bubble;
            }

            // disable the send button and the question chips while waiting for the answer
            function busy(on) {
                $('#chatSend').prop('disabled', on);
                $('.chip').prop('disabled', on);
            }

            function send(text) {
                if (!text.trim() || $('#chatSend').prop('disabled')) {
                    return;
                }
                add(text, 'user');
                $('#chatInput').val('');
                busy(true);
                var typing = add(/*[[#{chat.typing}]]*/ 'กำลังพิมพ์...', 'bot typing');

                var headers = {};
                headers[header] = token; // Spring Security needs the CSRF token on every POST

                $.ajax({
                    url: '/app/chat/send',
                    method: 'POST',
                    contentType: 'application/json',
                    dataType: 'json',
                    headers: headers,
                    data: JSON.stringify({ message: text, history: history }),
                    success: function (data) {
                        typing.remove();
                        add(data.reply, 'bot');
                        history.push({ role: 'user', text: text }, { role: 'bot', text: data.reply });
                    },
                    error: function (xhr, status, error) {
                        // 401, or the login page came back instead of JSON:
                        // the session ended (e.g. the server restarted), so log in again
                        if (xhr.status === 401 || status === 'parsererror') {
                            window.location.href = '/login?expired';
                            return;
                        }
                        typing.remove();
                        add(/*[[#{chat.error}]]*/ 'ขออภัย เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง', 'bot');
                    },
                    complete: function () {
                        busy(false);
                        $('#chatInput').focus();
                    }
                });
            }

            $('#chatForm').submit(function (e) {
                e.preventDefault();
                send($('#chatInput').val());
            });
            $('.chip').click(function () {
                send($(this).text());
            });
        });
    </script>
</main>
</body>
</html>
