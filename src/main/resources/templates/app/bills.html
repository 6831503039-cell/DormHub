<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/app :: layout(#{tab.bills}, 'bills', ~{::main})}">
<body>
<main th:with="today=${#temporals.createToday()}, DAYS=${T(java.time.temporal.ChronoUnit).DAYS},
               payTone=${ {'PENDING': 'warning', 'APPROVED': 'success', 'SUSPICIOUS': 'danger', 'REJECTED': 'neutral'} }">
    <h1 class="app-title" th:text="#{bills.title}">บิลและการชำระเงิน</h1>

    <th:block th:if="${tenant == null or tenant.room == null}">
        <div class="card">
            <div th:replace="~{fragments/ui :: emptyState('link', #{bills.none}, #{bills.notLinked}, null, null)}"></div>
        </div>
    </th:block>

    <th:block th:if="${unpaid != null}">
        <p class="app-sub" th:text="#{common.roomN(${tenant.room.roomNumber})} + ' · ' + (${#lists.isEmpty(unpaid)} ? #{bills.nothingDue} : #{bills.unpaidCount(${#lists.size(unpaid)})})"></p>

        <section class="card mb-3" th:each="v : ${unpaid}"
                 th:with="overdue=${v.bill.dueDate != null and v.bill.dueDate.isBefore(today)}"
                 th:attr="aria-label=#{bills.billFor(${v.bill.billMonth})}">
            <div class="card-header">
                <span th:text="#{bills.billFor(${v.bill.billMonth})}"></span>
                <span class="badge status-danger ms-auto" th:text="${overdue} ? #{bills.overdueDays(${DAYS.between(v.bill.dueDate, today)})} : #{common.unpaid}"></span>
            </div>
            <div class="card-body">
                <!-- my share first: this is the number to pay -->
                <div class="d-flex justify-content-between align-items-end mb-1">
                    <span class="text-muted small" th:text="#{bills.yourShare(${v.occupants})}"></span>
                    <span class="kpi-value" th:text="'฿' + ${#numbers.formatDecimal(v.share, 1, 'COMMA', 2, 'POINT')}"></span>
                </div>
                <p class="small mb-3" th:if="${v.bill.dueDate != null}" th:classappend="${overdue} ? 'text-danger' : 'text-muted'"
                   th:text="#{bills.dueOn(${#temporals.format(v.bill.dueDate, 'dd/MM/yyyy')})}"></p>

                <dl class="breakdown mb-4">
                    <dt th:text="#{bills.rent}">ค่าเช่า</dt><dd class="num" th:text="${#numbers.formatDecimal(v.bill.rent, 1, 'COMMA', 2, 'POINT')}"></dd>
                    <dt th:text="#{bills.electricUnits(${v.bill.electricUnits})}"></dt><dd class="num" th:text="${#numbers.formatDecimal(v.bill.electricCost, 1, 'COMMA', 2, 'POINT')}"></dd>
                    <dt th:text="#{bills.waterUnits(${v.bill.waterUnits})}"></dt><dd class="num" th:text="${#numbers.formatDecimal(v.bill.waterCost, 1, 'COMMA', 2, 'POINT')}"></dd>
                    <dt class="text-body fw-medium" th:text="#{bills.roomTotal}">รวมทั้งห้อง</dt><dd class="num fw-medium" th:text="'฿' + ${#numbers.formatDecimal(v.bill.total, 1, 'COMMA', 2, 'POINT')}"></dd>
                    <dt th:text="#{bills.paidApproved}">ชำระแล้ว (อนุมัติ)</dt><dd class="num" th:text="'฿' + ${#numbers.formatDecimal(v.bill.total - v.outstanding, 1, 'COMMA', 2, 'POINT')}"></dd>
                </dl>

                <th:block th:if="${v.outstanding > 0}">
                    <div class="step">
                        <span class="step-num">1</span>
                        <div class="flex-grow-1">
                            <p class="fw-medium mb-2" th:text="#{bills.step1}">สแกน QR ด้วยแอปธนาคาร แล้วกรอกยอดเอง</p>
                            <div class="text-center">
                                <div class="qr-box"><img th:src="@{/img/promptpay-qr.png}" th:alt="#{bills.qrAlt}" width="200" height="200"></div>
                                <div class="small mt-2">
                                    <div class="fw-medium" th:text="${promptpayName}"></div>
                                    <div class="text-muted num" th:text="#{bills.promptpay(${promptpayId})}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <form class="step" th:action="@{/app/bills/{id}/pay(id=${v.bill.id})}" method="post" enctype="multipart/form-data">
                        <span class="step-num">2</span>
                        <div class="flex-grow-1">
                            <p class="fw-medium mb-2" th:text="#{bills.step2}">แนบสลิป</p>
                            <div class="mb-3">
                                <label class="form-label" th:for="'amount' + ${v.bill.id}" th:text="#{bills.amount}">ยอดที่โอน (บาท)</label>
                                <input class="form-control" type="number" inputmode="decimal" name="amount" min="1" step="0.01"
                                       th:id="'amount' + ${v.bill.id}" th:value="${v.share < v.outstanding ? v.share : v.outstanding}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" th:for="'slip' + ${v.bill.id}" th:text="#{bills.slip}">รูปสลิป</label>
                                <input class="form-control" type="file" name="slip" accept="image/*" th:id="'slip' + ${v.bill.id}" required>
                                <div class="form-text" th:text="#{bills.slipHelp}">AI จะตรวจสลิปและตัดยอดให้อัตโนมัติถ้ายอดตรง</div>
                            </div>
                            <button class="btn btn-primary w-100" type="submit"><i data-lucide="upload"></i> <span th:text="#{bills.sendSlip}">ส่งสลิป</span></button>
                        </div>
                    </form>
                </th:block>

                <div class="mt-4" th:unless="${#lists.isEmpty(v.payments)}">
                    <h3 class="section-title mt-0 mb-2" th:text="#{bills.sentSlips}">สลิปที่ส่งแล้ว</h3>
                    <ul class="list-unstyled mb-0">
                        <li class="d-flex justify-content-between align-items-center gap-2 py-1 small" th:each="p : ${v.payments}">
                            <span class="num" th:text="${#temporals.format(p.submittedAt, 'dd/MM HH:mm')} + ' · ' + (${p.tenant != null} ? ${p.tenant.firstName} : '-') + ' · ฿' + ${#numbers.formatDecimal(p.amount, 1, 'COMMA', 2, 'POINT')}"></span>
                            <span th:class="'badge status-' + ${payTone[p.status.name()]}" th:text="#{${p.status.key}}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </section>

        <th:block th:if="${#lists.isEmpty(unpaid)}">
            <div class="card mb-3">
                <div th:replace="~{fragments/ui :: emptyState('badge-check', #{bills.allPaid.title}, #{bills.allPaid.text}, null, null)}"></div>
            </div>
        </th:block>

        <section class="card mb-4" aria-labelledby="historyTitle">
            <div class="card-header"><h2 class="h2 mb-0" id="historyTitle" th:text="#{bills.history}">ประวัติการชำระ</h2></div>
            <ul class="list-plain" th:unless="${#lists.isEmpty(history)}">
                <li th:each="v : ${history}">
                    <div>
                        <div class="item-title num" th:text="${v.bill.billMonth}"></div>
                        <div class="item-meta" th:text="#{bills.usage(${v.bill.electricUnits}, ${v.bill.waterUnits})}"></div>
                    </div>
                    <div class="item-end">
                        <div class="num fw-medium" th:text="'฿' + ${#numbers.formatDecimal(v.bill.total, 1, 'COMMA', 2, 'POINT')}"></div>
                        <span class="badge status-success" th:text="#{common.paid}">ชำระแล้ว</span>
                    </div>
                </li>
            </ul>
            <p class="text-muted small px-4 py-3 mb-0" th:if="${#lists.isEmpty(history)}" th:text="#{bills.noHistory}">ยังไม่มีประวัติ</p>
        </section>
    </th:block>
</main>
</body>
</html>
