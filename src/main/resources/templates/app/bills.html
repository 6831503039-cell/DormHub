<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/app :: layout('บิล', 'bills', ~{::main})}">
<body>
<main th:with="today=${#temporals.createToday()}, DAYS=${T(java.time.temporal.ChronoUnit).DAYS},
               payTone=${ {'PENDING': 'warning', 'APPROVED': 'success', 'SUSPICIOUS': 'danger', 'REJECTED': 'neutral'} }">
    <h1 class="app-title">บิลและการชำระเงิน</h1>

    <th:block th:if="${tenant == null or tenant.room == null}">
        <div class="card">
            <div th:replace="~{fragments/ui :: emptyState('link', 'ยังไม่มีบิล', 'บัญชียังไม่ผูกกับห้องพัก แจ้งเจ้าของหอให้บันทึกอีเมลของคุณในข้อมูลผู้เช่า', null, null)}"></div>
        </div>
    </th:block>

    <th:block th:if="${unpaid != null}">
        <p class="app-sub" th:text="'ห้อง ' + ${tenant.room.roomNumber} + ' · ' + (${#lists.isEmpty(unpaid)} ? 'ไม่มียอดค้าง' : 'ค้างชำระ ' + ${#lists.size(unpaid)} + ' บิล')"></p>

        <section class="card mb-3" th:each="v : ${unpaid}"
                 th:with="overdue=${v.bill.dueDate != null and v.bill.dueDate.isBefore(today)}"
                 th:attr="aria-label='บิลเดือน ' + ${v.bill.billMonth}">
            <div class="card-header">
                <span th:text="'บิลเดือน ' + ${v.bill.billMonth}"></span>
                <span class="badge status-danger ms-auto" th:text="${overdue} ? 'เลยกำหนด ' + ${DAYS.between(v.bill.dueDate, today)} + ' วัน' : 'ค้างชำระ'"></span>
            </div>
            <div class="card-body">
                <!-- my share first: this is the number to pay -->
                <div class="d-flex justify-content-between align-items-end mb-1">
                    <span class="text-muted small" th:text="'ส่วนของคุณ (หาร ' + ${v.occupants} + ' คน)'"></span>
                    <span class="kpi-value" th:text="'฿' + ${#numbers.formatDecimal(v.share, 1, 'COMMA', 2, 'POINT')}"></span>
                </div>
                <p class="small mb-3" th:if="${v.bill.dueDate != null}" th:classappend="${overdue} ? 'text-danger' : 'text-muted'"
                   th:text="'ครบกำหนด ' + ${#temporals.format(v.bill.dueDate, 'dd/MM/yyyy')}"></p>

                <dl class="breakdown mb-4">
                    <dt>ค่าเช่า</dt><dd th:text="${#numbers.formatDecimal(v.bill.rent, 1, 'COMMA', 2, 'POINT')}"></dd>
                    <dt th:text="'ค่าไฟ ' + ${v.bill.electricUnits} + ' หน่วย'"></dt><dd th:text="${#numbers.formatDecimal(v.bill.electricCost, 1, 'COMMA', 2, 'POINT')}"></dd>
                    <dt th:text="'ค่าน้ำ ' + ${v.bill.waterUnits} + ' หน่วย'"></dt><dd th:text="${#numbers.formatDecimal(v.bill.waterCost, 1, 'COMMA', 2, 'POINT')}"></dd>
                    <dt class="text-body fw-medium">รวมทั้งห้อง</dt><dd class="fw-medium" th:text="'฿' + ${#numbers.formatDecimal(v.bill.total, 1, 'COMMA', 2, 'POINT')}"></dd>
                    <dt>ชำระแล้ว (อนุมัติ)</dt><dd th:text="'฿' + ${#numbers.formatDecimal(v.bill.total - v.outstanding, 1, 'COMMA', 2, 'POINT')}"></dd>
                </dl>

                <th:block th:if="${v.outstanding > 0}">
                    <div class="step">
                        <span class="step-num">1</span>
                        <div class="flex-grow-1">
                            <p class="fw-medium mb-2">สแกน QR ด้วยแอปธนาคาร แล้วกรอกยอดเอง</p>
                            <div class="text-center">
                                <div class="qr-box"><img th:src="@{/img/promptpay-qr.png}" alt="QR พร้อมเพย์สำหรับชำระค่าเช่า" width="200" height="200"></div>
                                <div class="small mt-2">
                                    <div class="fw-medium" th:text="${promptpayName}">ชื่อบัญชี</div>
                                    <div class="text-muted num" th:text="'พร้อมเพย์ ' + ${promptpayId}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <form class="step" th:action="@{/app/bills/{id}/pay(id=${v.bill.id})}" method="post" enctype="multipart/form-data">
                        <span class="step-num">2</span>
                        <div class="flex-grow-1">
                            <p class="fw-medium mb-2">แนบสลิป</p>
                            <div class="mb-3">
                                <label class="form-label" th:for="'amount' + ${v.bill.id}">ยอดที่โอน (บาท)</label>
                                <input class="form-control" type="number" inputmode="decimal" name="amount" min="1" step="0.01"
                                       th:id="'amount' + ${v.bill.id}" th:value="${v.share < v.outstanding ? v.share : v.outstanding}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" th:for="'slip' + ${v.bill.id}">รูปสลิป</label>
                                <input class="form-control" type="file" name="slip" accept="image/*" th:id="'slip' + ${v.bill.id}" required>
                                <div class="form-text">AI จะตรวจสลิปและตัดยอดให้อัตโนมัติถ้ายอดตรง</div>
                            </div>
                            <button class="btn btn-primary w-100" type="submit"><i data-lucide="upload"></i> ส่งสลิป</button>
                        </div>
                    </form>
                </th:block>

                <div class="mt-4" th:unless="${#lists.isEmpty(v.payments)}">
                    <h3 class="section-title mt-0 mb-2">สลิปที่ส่งแล้ว</h3>
                    <ul class="list-unstyled mb-0">
                        <li class="d-flex justify-content-between align-items-center gap-2 py-1 small" th:each="p : ${v.payments}">
                            <span class="num" th:text="${#temporals.format(p.submittedAt, 'dd/MM HH:mm')} + ' · ' + (${p.tenant != null} ? ${p.tenant.firstName} : '-') + ' · ฿' + ${#numbers.formatDecimal(p.amount, 1, 'COMMA', 2, 'POINT')}"></span>
                            <span th:class="'badge status-' + ${payTone[p.status.name()]}" th:text="${p.status.label}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </section>

        <th:block th:if="${#lists.isEmpty(unpaid)}">
            <div class="card mb-3">
                <div th:replace="~{fragments/ui :: emptyState('badge-check', 'ไม่มียอดค้างชำระ', 'ชำระครบทุกบิลแล้ว ขอบคุณครับ', null, null)}"></div>
            </div>
        </th:block>

        <section class="card mb-4" aria-labelledby="historyTitle">
            <div class="card-header"><h2 class="h2 mb-0" id="historyTitle">ประวัติการชำระ</h2></div>
            <ul class="list-plain" th:unless="${#lists.isEmpty(history)}">
                <li th:each="v : ${history}">
                    <div>
                        <div class="item-title num" th:text="${v.bill.billMonth}"></div>
                        <div class="item-meta" th:text="'ไฟ ' + ${v.bill.electricUnits} + ' หน่วย · น้ำ ' + ${v.bill.waterUnits} + ' หน่วย'"></div>
                    </div>
                    <div class="item-end">
                        <div class="num fw-medium" th:text="'฿' + ${#numbers.formatDecimal(v.bill.total, 1, 'COMMA', 2, 'POINT')}"></div>
                        <span class="badge status-success">ชำระแล้ว</span>
                    </div>
                </li>
            </ul>
            <p class="text-muted small px-4 py-3 mb-0" th:if="${#lists.isEmpty(history)}">ยังไม่มีประวัติ</p>
        </section>
    </th:block>
</main>
</body>
</html>
