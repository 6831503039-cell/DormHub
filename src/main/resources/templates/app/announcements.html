<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/app :: layout(#{nav.announcements}, 'home', ~{::main})}">
<body>
<main>
    <h1 class="app-title" th:text="#{nav.announcements}">ประกาศ</h1>
    <p class="app-sub" th:text="#{announcements.sub(${residenceName})}">ข่าวสารจากสำนักงานหอพัก</p>

    <div class="card" th:if="${#lists.isEmpty(announcements)}">
        <div th:replace="~{fragments/ui :: emptyState(#{announcements.empty.title}, #{announcements.empty.text}, null, null)}"></div>
    </div>

    <div class="rows mb-5">
        <article class="news-card" th:each="a : ${announcements}" th:id="'a' + ${a.id}">
            <img th:if="${a.hasImage()}" class="news-image" th:src="@{/announcements/{id}/image(id=${a.id})}" th:alt="${a.title}" loading="lazy">
            <div class="py-3">
                <div class="d-flex gap-2 align-items-center mb-1">
                    <span class="badge status-info" th:if="${a.pinned}"><i data-lucide="pin"></i> <span th:text="#{announcements.pinned}">ปักหมุด</span></span>
                    <span class="item-meta num" th:text="${#temporals.format(a.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                </div>
                <h2 class="h2 mb-2" th:text="${a.title}"></h2>
                <p class="mb-0 pre-line" th:if="${a.body != null}" th:text="${a.body}"></p>
            </div>
        </article>
    </div>
</main>
</body>
</html>
