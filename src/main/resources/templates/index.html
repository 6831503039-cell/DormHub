<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('ภาพรวม')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('home')}"></nav>
<main class="container pb-5">
    <div th:replace="~{fragments :: flash}"></div>
    <h2 class="mb-4">ภาพรวมหอพัก</h2>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <a th:href="@{/rooms}" class="card stat-card text-bg-primary text-decoration-none h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div><div>ห้องทั้งหมด</div><div class="fs-2 fw-semibold" th:text="${roomCount}">0</div></div>
                    <i class="bi bi-door-closed"></i>
                </div>
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/rooms}" class="card stat-card text-bg-success text-decoration-none h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div><div>ห้องว่าง</div><div class="fs-2 fw-semibold" th:text="${availableCount}">0</div></div>
                    <i class="bi bi-door-open"></i>
                </div>
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/tenants}" class="card stat-card text-bg-info text-decoration-none h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div><div>ผู้เช่า</div><div class="fs-2 fw-semibold" th:text="${tenantCount}">0</div></div>
                    <i class="bi bi-people"></i>
                </div>
            </a>
        </div>
        <div class="col-6 col-lg-3">
            <a th:href="@{/repairs}" class="card stat-card text-bg-warning text-decoration-none h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div><div>แจ้งซ่อมค้าง</div><div class="fs-2 fw-semibold" th:text="${openRepairCount}">0</div></div>
                    <i class="bi bi-tools"></i>
                </div>
            </a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-semibold"><i class="bi bi-receipt"></i> บิลที่ยังไม่ชำระ</span>
            <span class="text-danger fw-semibold">
                รวม <span th:text="${#numbers.formatDecimal(unpaidTotal, 1, 'COMMA', 2, 'POINT')}">0.00</span> บาท
            </span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>เดือน</th><th>ห้อง</th><th class="text-end">ยอดรวม (บาท)</th><th></th></tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${unpaidBills}">
                        <td th:text="${b.billMonth}"></td>
                        <td th:text="${b.room.roomNumber}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(b.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-success" th:href="@{/bills/{id}/pay(id=${b.id})}">
                                <i class="bi bi-cash"></i> รับชำระ
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(unpaidBills)}">
                        <td colspan="4" class="text-center text-muted py-4">ไม่มีบิลค้างชำระ</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
