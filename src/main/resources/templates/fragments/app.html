<!DOCTYPE html>
<!-- Layout for the tenant's mobile-first app. Pages use:
     <html th:replace="~{fragments/app :: layout(#{page.title.key}, 'tab-key', ~{::main})}"> -->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, active, content)" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f6f1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · ' + ${dormName}">DormHub</title>
    <script th:src="@{/js/prefs.js}"></script>
    <th:block th:replace="~{fragments/fonts :: fonts}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/logo-icon.png}">
</head>
<body class="app-body">
<div class="app-wrap">
    <header class="app-header">
        <div class="d-flex align-items-center gap-2">
            <img class="brand-logo" th:src="@{/img/logo-icon.png}" alt="">
            <div>
                <div class="text-muted small" th:text="${dormName} + ' · ' + ${residenceName}">DormHub · SJD Mansion</div>
                <div class="fw-semibold" th:text="#{app.hello(${currentUser?.fullName})}">สวัสดี</div>
            </div>
        </div>
        <div class="dropdown">
            <button class="btn btn-ghost btn-icon account-btn" data-bs-toggle="dropdown" type="button" th:aria-label="#{nav.account}" aria-expanded="false">
                <img class="header-avatar" th:if="${currentUser != null and currentUser.hasAvatar()}"
                     th:src="@{/app/profile/avatar(v=${currentUser.avatarVersion})}" alt="">
                <i data-lucide="user" th:unless="${currentUser != null and currentUser.hasAvatar()}"></i>
            </button>
            <div class="dropdown-menu dropdown-menu-end">
                <span class="dropdown-item-text small text-muted" th:text="${currentUser?.email}"></span>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" th:href="@{/app/profile}" th:classappend="${active == 'profile'} ? 'active'"><i data-lucide="user-round-pen"></i> <span th:text="#{profile.edit}">แก้ไขโปรไฟล์</span></a>
                <button th:replace="~{fragments/ui :: settingsMenuItem}"></button>
                <form th:action="@{/logout}" method="post">
                    <button class="dropdown-item" type="submit"><i data-lucide="log-out"></i> <span th:text="#{common.logout}">ออกจากระบบ</span></button>
                </form>
            </div>
        </div>
    </header>

    <th:block th:replace="~{fragments/ui :: flash}"></th:block>

    <th:block th:replace="${content}"></th:block>
</div>

<nav class="bottom-nav" th:aria-label="#{nav.main}">
    <div class="inner">
        <a th:href="@{/app}" th:classappend="${active == 'home'} ? 'active'"><i data-lucide="house"></i><span th:text="#{tab.home}">หน้าแรก</span></a>
        <th:block th:if="${hasRoom}">
        <a th:href="@{/app/bills}" th:classappend="${active == 'bills'} ? 'active'"><i data-lucide="receipt"></i><span th:text="#{tab.bills}">บิล</span></a>
        <a class="ai" th:href="@{/app/chat}" th:classappend="${active == 'chat'} ? 'active'"><i data-lucide="sparkles"></i><span th:text="#{tab.chat}">ถาม AI</span></a>
        <a th:href="@{/app/laundry}" th:classappend="${active == 'laundry'} ? 'active'"><i data-lucide="washing-machine"></i><span th:text="#{tab.laundry}">ซักผ้า</span></a>
        <a th:href="@{/app/requests}" th:classappend="${active == 'requests'} ? 'active'"><i data-lucide="clipboard-list"></i><span th:text="#{tab.requests}">คำร้อง</span></a>
        </th:block>
        <!-- no room yet: only home and renting a room (HasRoomInterceptor blocks the other pages) -->
        <a th:unless="${hasRoom}" th:href="@{/app/rent}" th:classappend="${active == 'rent'} ? 'active'"><i data-lucide="building-2"></i><span th:text="#{home.rentRoom}">เช่าห้องพัก</span></a>
    </div>
</nav>
<div th:replace="~{fragments/ui :: confirmModal}"></div>
<div th:replace="~{fragments/ui :: settingsModal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
