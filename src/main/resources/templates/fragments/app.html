<!DOCTYPE html>
<!-- Layout for the tenant's mobile-first app. Pages use:
     <html th:replace="~{fragments/app :: layout('Title', 'tab-key', ~{::main})}"> -->
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, active, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f6f1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · ' + ${dormName}">DormHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/logo-icon.png}">
</head>
<body class="app-body">
<div class="app-wrap">
    <header class="app-header">
        <div class="d-flex align-items-center gap-2">
            <img class="brand-logo" th:src="@{/img/logo-icon.png}" alt="">
            <div>
                <div class="text-muted small" th:text="${dormName}">DormHub</div>
                <div class="fw-semibold" th:text="'สวัสดี, ' + ${currentUser?.fullName}">สวัสดี</div>
            </div>
        </div>
        <div class="dropdown">
            <button class="btn btn-ghost btn-icon" data-bs-toggle="dropdown" type="button" aria-label="บัญชีของฉัน" aria-expanded="false"><i data-lucide="user"></i></button>
            <div class="dropdown-menu dropdown-menu-end">
                <span class="dropdown-item-text small text-muted" th:text="${currentUser?.email}"></span>
                <form th:action="@{/logout}" method="post">
                    <button class="dropdown-item" type="submit"><i data-lucide="log-out"></i> ออกจากระบบ</button>
                </form>
            </div>
        </div>
    </header>

    <th:block th:replace="~{fragments/ui :: flash}"></th:block>

    <th:block th:replace="${content}"></th:block>
</div>

<nav class="bottom-nav" aria-label="เมนูหลัก">
    <div class="inner">
        <a th:href="@{/app}" th:classappend="${active == 'home'} ? 'active'"><i data-lucide="house"></i>หน้าแรก</a>
        <a th:href="@{/app/bills}" th:classappend="${active == 'bills'} ? 'active'"><i data-lucide="receipt"></i>บิล</a>
        <a class="ai" th:href="@{/app/chat}" th:classappend="${active == 'chat'} ? 'active'"><i data-lucide="sparkles"></i>ถาม AI</a>
        <a th:href="@{/app/laundry}" th:classappend="${active == 'laundry'} ? 'active'"><i data-lucide="washing-machine"></i>ซักผ้า</a>
        <a th:href="@{/app/requests}" th:classappend="${active == 'requests'} ? 'active'"><i data-lucide="clipboard-list"></i>คำร้อง</a>
    </div>
</nav>
<div th:replace="~{fragments/ui :: confirmModal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
