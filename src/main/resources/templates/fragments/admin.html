<!DOCTYPE html>
<!-- Layout for the owner's web app. Pages use:
     <html th:replace="~{fragments/admin :: layout('Title', 'menu-key', ~{::main})}"> -->
<html lang="th" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, active, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · ' + ${dormName} + ' Admin'">DormHub Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/logo-icon.png}">
</head>
<body>
<div class="admin-shell">
    <aside class="sidebar d-none d-lg-flex flex-column">
        <a class="brand mb-4 px-2" th:href="@{/admin}">
            <img class="brand-logo" th:src="@{/img/logo-icon.png}" alt="">
            <span th:text="${dormName}">DormHub</span>
        </a>
        <nav class="side-nav nav flex-column" th:fragment="adminNav(active)" aria-label="เมนูหลัก">
            <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/admin}"><i data-lucide="layout-dashboard"></i> ภาพรวม</a>
            <a class="nav-link" th:classappend="${active == 'analytics'} ? 'active'" th:href="@{/admin/analytics}"><i data-lucide="bar-chart-3"></i> วิเคราะห์ค่าไฟ</a>
            <div class="nav-section">ห้องพัก</div>
            <a class="nav-link" th:classappend="${active == 'layout'} ? 'active'" th:href="@{/admin/layout}"><i data-lucide="layout-grid"></i> แผนผังห้อง</a>
            <a class="nav-link" th:classappend="${active == 'rooms'} ? 'active'" th:href="@{/admin/rooms}"><i data-lucide="door-closed"></i> จัดการห้อง</a>
            <a class="nav-link" th:classappend="${active == 'tenants'} ? 'active'" th:href="@{/admin/tenants}"><i data-lucide="users"></i> ผู้เช่า</a>
            <a class="nav-link" th:classappend="${active == 'bookings'} ? 'active'" th:href="@{/admin/bookings}"><i data-lucide="inbox"></i> คำขอจอง</a>
            <div class="nav-section">การเงิน</div>
            <a class="nav-link" th:classappend="${active == 'bills'} ? 'active'" th:href="@{/admin/bills}"><i data-lucide="receipt"></i> บิลค่าเช่า</a>
            <a class="nav-link" th:classappend="${active == 'payments'} ? 'active'" th:href="@{/admin/payments}"><i data-lucide="scan-line"></i> ตรวจสลิป</a>
            <div class="nav-section">บริการ</div>
            <a class="nav-link" th:classappend="${active == 'repairs'} ? 'active'" th:href="@{/admin/repairs}"><i data-lucide="wrench"></i> แจ้งซ่อม</a>
            <a class="nav-link" th:classappend="${active == 'feedback'} ? 'active'" th:href="@{/admin/feedback}"><i data-lucide="message-square"></i> ฟีดแบ็ก</a>
        </nav>
        <div class="user-box mt-auto px-2">
            <div class="fw-medium" th:text="${currentUser?.fullName}">Admin</div>
            <div class="text-muted small mb-2" th:text="${currentUser?.email}"></div>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-secondary btn-sm w-100" type="submit" data-no-loading><i data-lucide="log-out"></i> ออกจากระบบ</button>
            </form>
        </div>
    </aside>

    <div class="admin-main">
        <header class="topbar d-flex d-lg-none justify-content-between align-items-center">
            <a class="brand" th:href="@{/admin}">
                <img class="brand-logo" th:src="@{/img/logo-icon.png}" alt="">
                <span th:text="${dormName}">DormHub</span>
            </a>
            <button class="btn btn-ghost btn-icon" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileNav"
                    aria-controls="mobileNav" aria-label="เปิดเมนู">
                <i data-lucide="menu"></i>
            </button>
        </header>
        <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileNav" style="width: 272px" aria-label="เมนู">
            <div class="offcanvas-header">
                <span class="brand"><img class="brand-logo" th:src="@{/img/logo-icon.png}" alt=""> <span th:text="${dormName}"></span></span>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="ปิดเมนู"></button>
            </div>
            <div class="offcanvas-body d-flex flex-column">
                <nav th:replace="~{fragments/admin :: adminNav(${active})}"></nav>
                <form class="mt-auto pt-3" th:action="@{/logout}" method="post">
                    <button class="btn btn-secondary w-100" type="submit"><i data-lucide="log-out"></i> ออกจากระบบ</button>
                </form>
            </div>
        </div>

        <div class="admin-content">
            <th:block th:replace="~{fragments/ui :: flash}"></th:block>
            <th:block th:replace="${content}"></th:block>
        </div>
    </div>
</div>
<div th:replace="~{fragments/ui :: confirmModal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script th:src="@{/js/ui.js}"></script>
</body>
</html>
