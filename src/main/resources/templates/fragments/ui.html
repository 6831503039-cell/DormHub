<!DOCTYPE html>
<!-- Shared UI components (design system). Behaviour lives in static/js/ui.js. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Confirm dialog used by every element with data-confirm="..."; included once per layout.
     Usage: <a th:href="..." data-confirm="ลบห้อง A101 ใช่ไหม?">ลบ</a> -->
<div th:fragment="confirmModal" class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div class="modal-icon"><i data-lucide="trash-2"></i></div>
                    <h2 class="modal-title" id="confirmModalTitle" data-confirm-title th:text="#{confirm.title}">ยืนยันการลบ</h2>
                </div>
            </div>
            <div class="modal-body">
                <p class="mb-0 text-muted" data-confirm-message></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{common.cancel}">ยกเลิก</button>
                <button type="button" class="btn btn-danger" data-confirm-ok th:text="#{common.delete}">ลบ</button>
            </div>
        </div>
    </div>
</div>

<!-- Empty state: icon (Lucide name), title, text; action link optional (pass null to hide it).
     Usage: <div th:replace="~{fragments/ui :: emptyState('door-closed', #{rooms.empty.title}, #{rooms.empty.text}, @{/admin/rooms/new}, #{rooms.add})}"></div> -->
<div th:fragment="emptyState(icon, title, text, actionHref, actionLabel)" class="empty-state">
    <div class="empty-icon"><i th:data-lucide="${icon}"></i></div>
    <p class="empty-title" th:text="${title}"></p>
    <p class="empty-text" th:if="${text != null}" th:text="${text}"></p>
    <a th:if="${actionHref != null}" class="btn btn-primary" th:href="${actionHref}">
        <i data-lucide="plus"></i> <span th:text="${actionLabel}"></span>
    </a>
</div>

<!-- Flash messages after a redirect (success / error). -->
<th:block th:fragment="flash">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show d-flex align-items-start gap-2" role="status">
        <i data-lucide="circle-check"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" th:aria-label="#{common.close}"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-start gap-2" role="alert">
        <i data-lucide="circle-alert"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" th:aria-label="#{common.close}"></button>
    </div>
</th:block>

<!-- Settings dialog: language (reloads the page with ?lang=) and colour theme (prefs.js, applied at once).
     Included once per page; open it with data-bs-toggle="modal" data-bs-target="#settingsModal". -->
<div th:fragment="settingsModal" class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="settingsModalTitle" th:text="#{settings.title}">ตั้งค่า</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{common.close}"></button>
            </div>
            <div class="modal-body">
                <div class="settings-group" role="group" aria-labelledby="settingsLangLabel">
                    <div class="form-label" id="settingsLangLabel"><i data-lucide="languages"></i> <span th:text="#{settings.language}">ภาษา</span></div>
                    <div class="choice-group">
                        <a class="choice" href="?lang=th" data-set-lang="th" lang="th" th:classappend="${#locale.language != 'en'} ? 'active'"
                           th:attr="aria-current=${#locale.language != 'en'} ? 'true' : null">ไทย</a>
                        <a class="choice" href="?lang=en" data-set-lang="en" lang="en" th:classappend="${#locale.language == 'en'} ? 'active'"
                           th:attr="aria-current=${#locale.language == 'en'} ? 'true' : null">English</a>
                    </div>
                </div>
                <div class="settings-group" role="radiogroup" aria-labelledby="settingsThemeLabel">
                    <div class="form-label" id="settingsThemeLabel"><i data-lucide="palette"></i> <span th:text="#{settings.theme}">ธีม</span></div>
                    <div class="choice-group">
                        <label class="choice"><input type="radio" name="theme" value="light"><i data-lucide="sun"></i> <span th:text="#{settings.theme.light}">สว่าง</span></label>
                        <label class="choice"><input type="radio" name="theme" value="dark"><i data-lucide="moon"></i> <span th:text="#{settings.theme.dark}">มืด</span></label>
                        <label class="choice"><input type="radio" name="theme" value="system"><i data-lucide="monitor"></i> <span th:text="#{settings.theme.system}">ตามระบบ</span></label>
                    </div>
                    <div class="form-text" th:text="#{settings.theme.help}">ตามระบบ = ใช้โหมดมืดเมื่อเครื่องของคุณใช้โหมดมืด</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Menu item that opens the Settings dialog; used inside the account dropdowns. -->
<button th:fragment="settingsMenuItem" class="dropdown-item" type="button" data-bs-toggle="modal" data-bs-target="#settingsModal">
    <i data-lucide="settings"></i> <span th:text="#{settings.title}">ตั้งค่า</span>
</button>

<!-- Line drawing of SJD Mansion: three 4-storey buildings in a U (C left, A in the middle at the back, B right).
     Strokes only, in the current text colour (set it with CSS). css: extra classes for size; label: alt text,
     or null when the drawing is decorative. Used on the login / register pages and in empty states. -->
<svg th:fragment="sjdDrawing(css, label)" class="sjd-drawing" th:classappend="${css}" viewBox="0 0 320 190"
     xmlns="http://www.w3.org/2000/svg" th:attr="role=${label != null} ? 'img' : null,aria-label=${label},aria-hidden=${label == null} ? 'true' : null">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
        <!-- ground and courtyard -->
        <path d="M8 178 H312"/>
        <path d="M100 160 H220" stroke-dasharray="3 4"/>
        <!-- A: middle, at the back, with the stair tower -->
        <rect x="100" y="40" width="120" height="120"/>
        <path d="M100 70 H220 M100 100 H220 M100 130 H220"/>
        <rect x="150" y="22" width="20" height="18"/>
        <path d="M156 40 V160 M164 40 V160" stroke-width="1"/>
        <!-- C: left wing, coming forward -->
        <path d="M80 62 L100 50 V160 L80 178 Z"/>
        <rect x="22" y="62" width="58" height="116"/>
        <path d="M22 91 H80 M22 120 H80 M22 149 H80"/>
        <!-- B: right wing, coming forward -->
        <path d="M240 62 L220 50 V160 L240 178 Z"/>
        <rect x="240" y="62" width="58" height="116"/>
        <path d="M240 91 H298 M240 120 H298 M240 149 H298"/>
    </g>
    <!-- windows -->
    <g fill="none" stroke="currentColor" stroke-width="1">
        <th:block th:each="f : ${#numbers.sequence(0, 3)}">
            <rect th:each="c : ${#numbers.sequence(0, 4)}" th:unless="${c == 2}" th:x="${108 + c * 22}" th:y="${48 + f * 30}" width="8" height="12"/>
            <rect th:each="c : ${#numbers.sequence(0, 2)}" th:x="${30 + c * 17}" th:y="${70 + f * 29}" width="7" height="11"/>
            <rect th:each="c : ${#numbers.sequence(0, 2)}" th:x="${249 + c * 17}" th:y="${70 + f * 29}" width="7" height="11"/>
        </th:block>
    </g>
    <!-- building letters -->
    <g fill="currentColor" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">
        <text x="51" y="58">C</text>
        <text x="160" y="35">A</text>
        <text x="269" y="58">B</text>
    </g>
</svg>

<!-- Left half of the login / register pages on wide screens: the SJD drawing, the dorm name and one line. -->
<aside th:fragment="authArt" class="auth-art">
    <svg th:replace="~{fragments/ui :: sjdDrawing('auth-art-drawing', #{drawing.sjd.alt(${residenceName})})}"></svg>
    <div class="auth-art-text">
        <p class="auth-art-name" th:text="${residenceName}">SJD Mansion</p>
        <p class="auth-art-line" th:text="#{auth.art.line(${dormName})}">จัดการหอพักด้วย DormHub</p>
    </div>
</aside>

<!-- Status: 8px dot + text, e.g. "● ชำระแล้ว". tone: success | info | warning | soon | danger | neutral
     (enum badge names primary / secondary work too). Only danger gets a coloured background.
     Use: <span th:replace="~{fragments/ui :: status('success', #{common.paid})}"></span>
     th:replace runs before th:if, so put a condition on a <th:block> around it. -->
<span th:fragment="status(tone, text)" class="status" th:classappend="'status-' + ${tone}"><span class="status-dot" aria-hidden="true"></span><span th:text="${text}">สถานะ</span></span>

<!-- Booking form for the 3D room map; dorm3d.js copies it into the room panel and fills room, date and title.
     action: where it posts; fullName / email: pre-filled values (null on the public page); emailLocked: the
     account's email is used, so the field is read-only -->
<template th:fragment="bookTemplate(action, fullName, email, emailLocked)" id="bookTpl">
    <form class="d3-book" th:action="${action}" method="post">
        <div class="fw-semibold" data-field="title" th:text="#{book.title}">จองห้อง</div>
        <input type="hidden" name="room" data-field="room">
        <div>
            <label class="form-label" for="bkName" th:text="#{common.fullName}">ชื่อ-นามสกุล</label>
            <input class="form-control" id="bkName" name="fullName" maxlength="100" autocomplete="name" th:value="${fullName}" required>
        </div>
        <div>
            <label class="form-label" for="bkPhone" th:text="#{book.phone}">เบอร์โทรศัพท์</label>
            <input class="form-control" id="bkPhone" name="phone" type="tel" maxlength="20" placeholder="08x-xxx-xxxx" autocomplete="tel" required>
        </div>
        <div>
            <label class="form-label" for="bkEmail" th:text="${emailLocked} ? #{common.email} : #{common.email} + ' ' + #{common.optional}">อีเมล (ไม่บังคับ)</label>
            <input class="form-control" id="bkEmail" name="email" type="email" maxlength="100" autocomplete="email" th:value="${email}" th:readonly="${emailLocked}">
        </div>
        <div>
            <label class="form-label" for="bkDate" th:text="#{book.moveIn}">วันที่ต้องการเข้าอยู่</label>
            <input class="form-control" id="bkDate" name="moveInDate" type="date" data-field="date" required>
        </div>
        <div>
            <label class="form-label" for="bkNote" th:text="#{book.note} + ' ' + #{common.optional}">ข้อความถึงหอ (ไม่บังคับ)</label>
            <textarea class="form-control" id="bkNote" name="note" rows="2" maxlength="500"></textarea>
        </div>
        <button class="btn btn-primary w-100" type="submit"><i data-lucide="send"></i> <span th:text="#{book.send}">ส่งคำขอจอง</span></button>
        <div class="small text-muted" th:text="${emailLocked} ? #{rent.afterConfirm} : #{book.noPayment}">ยังไม่ต้องโอนเงิน เจ้าหน้าที่หอจะติดต่อกลับเพื่อยืนยันการจอง</div>
    </form>
</template>

</body>
</html>
